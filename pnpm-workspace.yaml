packages:
  - native
  - packages/*

linkWorkspacePackages: true

allowBuilds:
  esbuild: true

minimumReleaseAge: 2880

# Reviewed upstream releases required by the dependency refresh.
minimumReleaseAgeExclude:
  - '@napi-rs/cli@3.10.8'
  - '@types/node@26.6.5'
  - 'vite@8.3.4'

overrides:
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  ip-address@<=10.7.3: ^10.7.4
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
