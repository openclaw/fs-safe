name: coverage

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      windows_capacity_proof:
        description: Qualify Windows coverage capacity while preserving all platform inputs and merged thresholds
        required: false
        default: false
        type: boolean
      windows_standard_runner:
        description: Use standard four-core Windows for coverage qualification (otherwise 16-core control)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.windows_capacity_proof && (inputs.windows_standard_runner && '-standard' || '-control') || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    # Keep the required status identifier; runs-on uses the current matrix runner.
    name: Node 22 coverage (${{ matrix.os == 'xcode-27' && 'macos-15' || matrix.os }})${{ matrix.os == 'windows-latest' && github.event_name == 'workflow_dispatch' && inputs.windows_capacity_proof && (inputs.windows_standard_runner && ' [4-core candidate]' || ' [16-core control]') || '' }}
    runs-on: ${{ matrix.os == 'windows-latest' && (github.event_name == 'workflow_dispatch' && inputs.windows_capacity_proof && inputs.windows_standard_runner && 'windows-latest' || 'fs-safe-windows-16core') || matrix.os }}
    # Windows includes native/WASM builds and serial instrumented filesystem tests.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 20 || 15 }}
    strategy:
      fail-fast: false
      # Platform branches depend on the OS, not the supported Node release.
      # Node 22 preserves comparison with the previous coverage lane without
      # duplicating the native build on all six test-matrix combinations.
      matrix:
        os:
          - ubuntu-latest
          - xcode-27
          - windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Windows CI runner
        if: matrix.os == 'windows-latest'
        uses: ./.github/actions/verify-windows-ci-runner
        with:
          minimum-logical-processors: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_capacity_proof && inputs.windows_standard_runner && '4' || '16' }}

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "22"

      - name: Add portable TAR parser target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # LLVM setup exports temporary paths; key its pinned toolchain source instead.
          key: ${{ matrix.os }}-${{ hashFiles('.github/actions/setup-archive-llvm/**', 'scripts/archive-wasm-build-tools.mjs', 'scripts/build-archive-wasm.mjs') }}
          env-vars: CARGO CC AR CFLAGS CXX CMAKE RUST
          workspaces: |
            . -> target
            . -> target/archive-wasm-allocator-tests

      - name: Set up portable archive LLVM
        uses: ./.github/actions/setup-archive-llvm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build host binding
        run: pnpm native:build

      - name: Record exact-source workload admission
        if: matrix.os == 'windows-latest' && github.event_name == 'workflow_dispatch' && inputs.windows_capacity_proof
        env:
          FS_SAFE_CAPACITY_WORKLOAD: coverage
          FS_SAFE_CAPACITY_STANDARD: ${{ inputs.windows_standard_runner }}
          FS_SAFE_CAPACITY_EXPECTED_COMMIT: ${{ github.sha }}
          FS_SAFE_CAPACITY_NODE: "22"
        run: node scripts/windows-capacity-proof.mjs

      - name: Coverage
        run: pnpm test:coverage:collect

      - name: Upload coverage input
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ runner.os }}
          path: coverage/coverage-final.json
          if-no-files-found: error

      - name: Upload workload admission proof
        if: always() && matrix.os == 'windows-latest' && github.event_name == 'workflow_dispatch' && inputs.windows_capacity_proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-coverage-admission
          path: ${{ runner.temp }}/fs-safe-windows-capacity-proof.json
          if-no-files-found: error
          retention-days: 7

  report:
    name: Merged coverage
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download coverage inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage-inputs

      - name: Merge coverage and enforce thresholds
        run: pnpm test:coverage:merge

      - name: Summarize coverage
        if: always()
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const summaryPath = "coverage/coverage-summary.json";
          if (!fs.existsSync(summaryPath)) process.exit(0);
          const total = JSON.parse(fs.readFileSync(summaryPath, "utf8")).total;
          const pct = (key) => total[key].pct.toFixed(2);
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              "# fs-safe merged coverage",
              "",
              "| Metric | Percent |",
              "|---|---:|",
              `| Lines | ${pct("lines")}% |`,
              `| Statements | ${pct("statements")}% |`,
              `| Functions | ${pct("functions")}% |`,
              `| Branches | ${pct("branches")}% |`,
              "",
            ].join("\n"),
          );
          NODE

      - name: Upload merged coverage results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fs-safe-coverage-${{ github.run_id }}
          path: coverage/
          if-no-files-found: error

  rust-coverage:
    name: Rust coverage (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "22"

      - name: Set up coverage toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          rustup toolchain install nightly-2026-09-25 --profile minimal --component llvm-tools-preview

      - name: Cache cargo-llvm-cov
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: cargo-llvm-cov-0.9.1
          cache-targets: "false"

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: Set up portable archive LLVM
        uses: ./.github/actions/setup-archive-llvm

      - name: Build package
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Measure native unit tests and TS addon suites
        run: bash scripts/native-coverage.sh

      - name: Upload Rust coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fs-safe-rust-coverage-${{ github.run_id }}
          path: coverage-rust/
          if-no-files-found: error
