name: coverage

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Node 22 coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Platform branches depend on the OS, not the supported Node release.
      # Node 22 preserves comparison with the previous coverage lane without
      # duplicating the native build on all six test-matrix combinations.
      matrix:
        os:
          - ubuntu-latest
          - macos-15
          - windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build host binding
        run: pnpm native:build

      - name: Coverage
        run: pnpm test:coverage:collect

      - name: Upload coverage input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ runner.os }}
          path: coverage/coverage-final.json
          if-no-files-found: error

  report:
    name: Merged coverage
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download coverage inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: coverage-inputs

      - name: Merge coverage and enforce thresholds
        run: pnpm test:coverage:merge

      - name: Summarize coverage
        if: always()
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const summaryPath = "coverage/coverage-summary.json";
          if (!fs.existsSync(summaryPath)) process.exit(0);
          const total = JSON.parse(fs.readFileSync(summaryPath, "utf8")).total;
          const pct = (key) => total[key].pct.toFixed(2);
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              "# fs-safe merged coverage",
              "",
              "| Metric | Percent |",
              "|---|---:|",
              `| Lines | ${pct("lines")}% |`,
              `| Statements | ${pct("statements")}% |`,
              `| Functions | ${pct("functions")}% |`,
              `| Branches | ${pct("branches")}% |`,
              "",
            ].join("\n"),
          );
          NODE

      - name: Upload merged coverage results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fs-safe-coverage-${{ github.run_id }}
          path: coverage/
          if-no-files-found: error
