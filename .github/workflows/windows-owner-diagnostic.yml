name: Windows owner diagnostic
on:
  pull_request:
permissions:
  contents: read
jobs:
  proof:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 24
      - uses: ./.github/actions/setup-windows-helper
      - uses: ./.github/actions/setup-archive-llvm
      - run: rustup target add wasm32-unknown-unknown
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:windows-helper
      - run: pnpm build
      - run: pnpm test test/windows-owner-helper.windows.test.ts test/windows-security-batch-budget.windows.test.ts
      - run: node scripts/windows-owner-measure.mjs
