name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  NPM_VERSION: 12.0.1
  PNPM_VERSION: 10.34.5

jobs:
  validate:
    name: Validate release source
    if: github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate tag, changelog, and versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! printf '%s\n' "${RELEASE_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "release tag must match vX.Y.Z; received ${RELEASE_TAG}" >&2
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" != "tag" ]; then
            echo "release tag ${RELEASE_TAG} must be annotated" >&2
            exit 1
          fi
          release_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor "${release_commit}" origin/main
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const version = process.env.RELEASE_TAG.slice(1);
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          if (pkg.name !== "@openclaw/fs-safe" || pkg.version !== version) {
            throw new Error(`root package is ${pkg.name}@${pkg.version}, expected @openclaw/fs-safe@${version}`);
          }
          const nativePkg = JSON.parse(readFileSync("native/package.json", "utf8"));
          if (!nativePkg.private || nativePkg.version !== version) {
            throw new Error(`private native build workspace must declare ${version}`);
          }
          const cargo = readFileSync("native/Cargo.toml", "utf8");
          if (!cargo.match(new RegExp(`^version = "${version.replaceAll(".", "\\.")}"$`, "m"))) {
            throw new Error(`native/Cargo.toml does not declare ${version}`);
          }
          NODE
          package_version="$(node -p "require('./package.json').version")"
          [ "${RELEASE_TAG}" = "v${package_version}" ]
          node scripts/release-notes.mjs "${package_version}" >/dev/null

      - name: Check TypeScript package
        run: pnpm check

      - name: Test native crate
        run: cargo test --workspace --locked

  prebuild:
    name: Build ${{ matrix.label }}
    if: github.ref_protected
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: none
          - label: linux-x64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: zig
          - label: linux-arm64-gnu
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: napi
          - label: linux-arm64-musl
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: zig
          - label: darwin-x64
            os: macos-15
            target: x86_64-apple-darwin
            cross: none
          - label: darwin-arm64
            os: macos-15
            target: aarch64-apple-darwin
            cross: none
          - label: win32-x64-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: none
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Zig
        if: matrix.cross == 'zig'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.cross == 'zig'
        run: cargo install cargo-zigbuild --version 0.23.0 --locked

      - name: Build native binding
        if: matrix.cross == 'none'
        run: pnpm --filter @openclaw/fs-safe-native-build exec napi build --release --platform --target ${{ matrix.target }} --output-dir ../artifacts

      - name: Build native binding with napi cross toolchain
        if: matrix.cross == 'napi'
        run: pnpm --filter @openclaw/fs-safe-native-build exec napi build --release --platform --target ${{ matrix.target }} --use-napi-cross --output-dir ../artifacts

      - name: Build native binding with Zig
        if: matrix.cross == 'zig'
        run: pnpm --filter @openclaw/fs-safe-native-build exec napi build --release --platform --target ${{ matrix.target }} --cross-compile --output-dir ../artifacts

      - name: Upload binding
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binding-${{ matrix.label }}
          path: artifacts/*.node
          if-no-files-found: error
          retention-days: 1

  collect:
    name: Assemble and validate @openclaw/fs-safe
    if: github.ref_protected
    needs: prebuild
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Download all seven bindings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binding-*
          path: artifacts
          merge-multiple: true

      - name: Assemble bundled bindings
        run: node scripts/assemble-native-binaries.mjs --source artifacts --destination dist/native

      - name: Pack and smoke test the single package
        run: node scripts/check-release-packages.mjs --output release-artifacts

      - name: Upload release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish @openclaw/fs-safe
    if: github.ref_protected
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Download release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: release-artifacts

      - name: Publish validated artifact or verify
        run: node scripts/publish-or-verify.mjs --package "@openclaw/fs-safe" --artifacts release-artifacts

  release:
    name: Publish GitHub Release
    if: github.ref_protected
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: release-artifacts

      - name: Generate release notes and proof
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="${RELEASE_TAG#v}"
          node scripts/release-notes.mjs "${package_version}" > release-notes.md
          node scripts/append-release-proof.mjs release-notes.md release-artifacts/manifest.json "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} already has a GitHub release."
            exit 0
          fi
          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --title "fs-safe ${RELEASE_TAG#v}" \
            --notes-file release-notes.md
