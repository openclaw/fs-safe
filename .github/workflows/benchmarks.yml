name: benchmarks

on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      method_audit:
        description: Run the complete callable-method matrix
        type: boolean
        default: false
      platform:
        description: Method-audit platform
        type: choice
        options: ["all", "linux", "macos", "windows"]
        default: "all"
      compare_ref:
        description: Optional baseline Git ref for the same runner and harness
        type: string
        default: ""
      iterations:
        description: Method-audit iterations
        type: string
        default: "20"
      samples:
        description: Method-audit samples
        type: string
        default: "5"
      filter:
        description: Optional method-name substring for a focused audit
        type: string
        default: ""
      order:
        description: Baseline/candidate measurement order
        type: choice
        options: ["baseline-candidate", "abba"]
        default: "baseline-candidate"
      blocks:
        description: Number of complete measurement-order blocks
        type: string
        default: "1"
      native_mode:
        description: Native mode selection
        type: choice
        options: ["both", "off", "require"]
        default: "both"

permissions:
  contents: read

jobs:
  method-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.method_audit
    name: Method audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'linux' && '["ubuntu-latest"]' || inputs.platform == 'macos' && '["macos-15"]' || inputs.platform == 'windows' && '["windows-latest"]' || '["ubuntu-latest","macos-15","windows-latest"]') }}
    defaults:
      run:
        shell: bash
    env:
      METHOD_ITERATIONS: ${{ inputs.iterations }}
      METHOD_SAMPLES: ${{ inputs.samples }}
      METHOD_FILTER: ${{ inputs.filter }}
      METHOD_ORDER: ${{ inputs.order }}
      METHOD_BLOCKS: ${{ inputs.blocks }}
      METHOD_NATIVE_MODE: ${{ inputs.native_mode }}
      BASE_REF: ${{ inputs.compare_ref }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Add portable TAR parser target
        run: rustup target add wasm32-unknown-unknown
      - name: Build candidate
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm native:build
      - name: Build baseline
        if: inputs.compare_ref != ''
        run: |
          git fetch --no-tags -- origin "$BASE_REF"
          git worktree add --detach "$RUNNER_TEMP/fs-safe-method-baseline" FETCH_HEAD
          cd "$RUNNER_TEMP/fs-safe-method-baseline"
          pnpm install --frozen-lockfile
          pnpm build
          pnpm native:build
      - name: Measure all methods
        run: |
          mkdir -p artifacts/method-audit
          if [[ ! "$METHOD_BLOCKS" =~ ^[1-5]$ ]]; then
            echo "blocks must be an integer from 1 through 5" >&2
            exit 2
          fi
          run_variant() {
            local label="$1"
            local dist="$2"
            local modes=(off require)
            if [[ "$METHOD_NATIVE_MODE" != "both" ]]; then modes=("$METHOD_NATIVE_MODE"); fi
            for mode in "${modes[@]}"; do
              local report="artifacts/method-audit/$label-$mode.json"
              local args=(--mode "$mode" --iterations "$METHOD_ITERATIONS" --samples "$METHOD_SAMPLES" --warmup 3 --json "$report")
              if [[ -n "$dist" ]]; then args+=(--dist "$dist"); fi
              if [[ -n "$METHOD_FILTER" ]]; then args+=(--filter "$METHOD_FILTER"); fi
              # Git Bash rewrites leading-slash arguments for native programs.
              # Keep filters byte-exact; RUNNER_TEMP is already a native path.
              MSYS2_ARG_CONV_EXCL='*' pnpm benchmark:methods "${args[@]}"
              REPORT_PATH="$report" REPORT_LABEL="$label" REPORT_MODE="$mode" node --input-type=module -e '
                import fs from "node:fs";
                const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, "utf8"));
                const measured = Array.isArray(report.results) &&
                  report.results.some((result) => result.skipped === undefined);
                if (!measured) {
                  console.error("No measured cases for filter " +
                    JSON.stringify(process.env.METHOD_FILTER) + " on " + process.platform + "/" +
                    process.env.REPORT_MODE + " (" + process.env.REPORT_LABEL + ")");
                  process.exit(2);
                }
              '
            done
          }
          baseline_dist="$RUNNER_TEMP/fs-safe-method-baseline/dist"
          if [[ "$METHOD_ORDER" == "abba" ]]; then
            if [[ -z "$BASE_REF" ]]; then
              echo "ABBA order requires compare_ref" >&2
              exit 2
            fi
            if [[ -z "$METHOD_FILTER" ]]; then
              echo "ABBA order requires a focused method filter" >&2
              exit 2
            fi
            for (( block = 1; block <= METHOD_BLOCKS; block += 1 )); do
              run_variant "block-$block-baseline-a" "$baseline_dist"
              run_variant "block-$block-candidate-a" ""
              run_variant "block-$block-candidate-b" ""
              run_variant "block-$block-baseline-b" "$baseline_dist"
            done
          else
            for (( block = 1; block <= METHOD_BLOCKS; block += 1 )); do
              if [[ -n "$BASE_REF" ]]; then run_variant "block-$block-baseline" "$baseline_dist"; fi
              run_variant "block-$block-candidate" ""
            done
          fi
      - name: Upload method measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: method-audit-${{ matrix.os }}-${{ github.run_id }}
          path: artifacts/method-audit/
          if-no-files-found: warn

  benchmark:
    name: Node 22 benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Add portable TAR parser target
        run: rustup target add wasm32-unknown-unknown

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Benchmark
        env:
          FS_SAFE_BENCHMARK_SAMPLES: ${{ github.event_name == 'schedule' && '3' || '1' }}
        run: |
          mkdir -p dist/benchmarks
          pnpm benchmark -- --json dist/benchmarks/results.json --markdown dist/benchmarks/summary.md

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fs-safe-benchmark-${{ github.run_id }}
          path: dist/benchmarks/
