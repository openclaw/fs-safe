name: benchmarks

on:
  workflow_dispatch:
    inputs:
      build_only:
        description: Require the fixed PR670 build and untimed installed qualification
        type: boolean
        default: true
      compare_ref:
        description: Exact reviewed baseline commit
        type: string
        required: true
      candidate_ref:
        description: Exact reviewed candidate commit
        type: string
        required: true
      expected_harness_sha:
        description: Exact reviewed workflow commit
        type: string
        required: true

permissions:
  contents: read

jobs:
  prepare-common-root:
    if: github.event_name == 'workflow_dispatch' && inputs.build_only
    name: Assemble common baseline root with pinned released WASM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      root_sha256: ${{ steps.assemble.outputs.root_sha256 }}
      manifest_sha256: ${{ steps.assemble.outputs.manifest_sha256 }}
      proof_sha256: ${{ steps.assemble.outputs.proof_sha256 }}
    env:
      PAIR_HARNESS_SHA: ${{ github.workflow_sha }}
      PAIR_EXPECTED_HARNESS_SHA: ${{ inputs.expected_harness_sha }}
      PAIR_BASELINE_INPUT: ${{ inputs.compare_ref }}
      PAIR_CANDIDATE_INPUT: ${{ inputs.candidate_ref }}
    steps:
      - name: Validate exact reviewed input refs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PAIR_EXPECTED_HARNESS_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PAIR_EXPECTED_HARNESS_SHA" = "$PAIR_HARNESS_SHA" ]]
          [[ "$PAIR_BASELINE_INPUT" = "554fd1c3c3e5f5adc127dcdf416d859a724703f7" ]]
          [[ "$PAIR_CANDIDATE_INPUT" = "95269878a1a6254f28977e373d979a6b254cf733" ]]
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Check out reviewed preparation harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: harness
          persist-credentials: false
      - name: Check out baseline with release source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 554fd1c3c3e5f5adc127dcdf416d859a724703f7
          fetch-depth: 0
          path: baseline
          persist-credentials: false
      - name: Check out candidate for source correspondence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 95269878a1a6254f28977e373d979a6b254cf733
          path: candidate
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          run_install: false
      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Install frozen compiler dependencies without lifecycle scripts
        timeout-minutes: 3
        working-directory: baseline
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Assemble and strictly compare the common root
        id: assemble
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/harness/scripts/windows-info-proof/prepare-root.mjs"             "$GITHUB_WORKSPACE/baseline" "$GITHUB_WORKSPACE/candidate" "$RUNNER_TEMP/common-root-output"
      - name: Upload exact common root and preparation receipts
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-info-common-root-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/common-root-output/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve preparation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-info-common-root-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preparation-data/
          if-no-files-found: warn
          retention-days: 7

  windows-native-pair:
    needs: prepare-common-root
    permissions:
      contents: read
      actions: read
    if: github.event_name == 'workflow_dispatch' && inputs.build_only
    name: Windows fixed-record pair (build and installed qualification; no timing)
    runs-on: fs-safe-windows-16core
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      PAIR_HARNESS_SHA: ${{ github.workflow_sha }}
      PAIR_EXPECTED_HARNESS_SHA: ${{ inputs.expected_harness_sha }}
      PAIR_BASELINE_INPUT: ${{ inputs.compare_ref }}
      PAIR_CANDIDATE_INPUT: ${{ inputs.candidate_ref }}
      RUSTUP_TOOLCHAIN: 1.98.1
      COMMON_ROOT_SHA256: ${{ needs.prepare-common-root.outputs.root_sha256 }}
      COMMON_ROOT_MANIFEST_SHA256: ${{ needs.prepare-common-root.outputs.manifest_sha256 }}
      COMMON_ROOT_PROOF_SHA256: ${{ needs.prepare-common-root.outputs.proof_sha256 }}
      COMMON_ROOT_ARTIFACT_ID: ${{ needs.prepare-common-root.outputs.artifact_id }}
      COMMON_ROOT_ARTIFACT_DIGEST: ${{ needs.prepare-common-root.outputs.artifact_digest }}
    steps:
      - name: Validate fixed source inputs and configure byte-exact checkout
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PAIR_EXPECTED_HARNESS_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:PAIR_EXPECTED_HARNESS_SHA -cne $env:PAIR_HARNESS_SHA) { throw 'Exact reviewed workflow commit required' }
          if ($env:PAIR_BASELINE_INPUT -cne '554fd1c3c3e5f5adc127dcdf416d859a724703f7' -or $env:PAIR_CANDIDATE_INPUT -cne '95269878a1a6254f28977e373d979a6b254cf733') { throw 'Only the fixed reviewed native pair is allowed' }
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Check out reviewed build harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: harness
          persist-credentials: false
      - name: Check out exact baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 554fd1c3c3e5f5adc127dcdf416d859a724703f7
          path: baseline
          persist-credentials: false
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 95269878a1a6254f28977e373d979a6b254cf733
          path: candidate
          persist-credentials: false
      - name: Verify Windows CI runner
        uses: ./harness/.github/actions/verify-windows-ci-runner
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          run_install: false
      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Install exact Rust toolchain
        timeout-minutes: 15
        run: |
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust installation failed' }
      - name: Bind common artifact to this reviewed workflow run
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GH_REPOSITORY -cne 'openclaw/fs-safe' -or $env:COMMON_ROOT_ARTIFACT_ID -cnotmatch '^[1-9][0-9]*$') { throw 'Common artifact identity invalid' }
          foreach ($value in @($env:COMMON_ROOT_ARTIFACT_DIGEST,$env:COMMON_ROOT_SHA256,$env:COMMON_ROOT_MANIFEST_SHA256,$env:COMMON_ROOT_PROOF_SHA256)) {
            if ($value -cnotmatch '^[0-9a-f]{64}$') { throw 'Common artifact digest absent or invalid' }
          }
          $headers = @{ Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28' }
          $artifact = Invoke-RestMethod -Uri "$env:GH_API_URL/repos/$env:GH_REPOSITORY/actions/artifacts/$env:COMMON_ROOT_ARTIFACT_ID" -Headers $headers -TimeoutSec 60
          if ([string]$artifact.id -cne $env:COMMON_ROOT_ARTIFACT_ID -or $artifact.expired -or $artifact.name -cne "windows-info-common-root-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" -or [string]$artifact.workflow_run.id -cne $env:GITHUB_RUN_ID -or $artifact.workflow_run.head_sha -cne $env:PAIR_HARNESS_SHA -or $artifact.digest -cne "sha256:$env:COMMON_ROOT_ARTIFACT_DIGEST" -or $artifact.size_in_bytes -gt 8388608) { throw 'Common artifact metadata does not match this preparation' }
          $receipt = [ordered]@{ id=[string]$artifact.id; name=$artifact.name; digest=$artifact.digest; bytes=$artifact.size_in_bytes; runId=[string]$artifact.workflow_run.id; harnessSha=$artifact.workflow_run.head_sha; attempt=$env:GITHUB_RUN_ATTEMPT }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'windows-info-common-root-transport.json'),($receipt | ConvertTo-Json),[Text.UTF8Encoding]::new($false))
      - name: Download the one exact common-root artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare-common-root.outputs.artifact_id }}
          path: ${{ runner.temp }}/windows-info-common-root-input
          merge-multiple: true
      - name: Build exact native pair and prove installed NTFS/ReFS contracts
        timeout-minutes: 90
        run: ./harness/scripts/windows-info-proof/supervisor.ps1
      - name: Ensure owned VHD is dismounted and removed
        if: always()
        timeout-minutes: 5
        run: |
          if (Test-Path -LiteralPath './harness/scripts/windows-info-proof/supervisor.ps1') {
            ./harness/scripts/windows-info-proof/supervisor.ps1 -CleanupOnly
          }
      - name: Upload native pair and receipts
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-info-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fs-safe-windows-info-proof/artifacts/
          if-no-files-found: warn
          retention-days: 7
