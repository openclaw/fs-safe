name: PR 323 optimized candidate prospective Windows proofs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-proof:
    name: Verify frozen proof harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
      - run: rustup target add wasm32-unknown-unknown
      - run: pnpm install --frozen-lockfile
      - name: Check frozen plans and schedules without sampling
        run: node scripts/pr323-optimized-proof-selfcheck.mjs
      - name: Repository check
        run: pnpm check
      - run: git diff --check

  paired-proof:
    name: Windows Node 22 ${{ matrix.experiment }} proof
    needs: verify-proof
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        experiment: [producer-fix, producer-final, archive-final]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out frozen proof harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          architecture: x64
      - run: rustup target add wasm32-unknown-unknown

      - name: Create fresh isolated proof root
        env:
          EXPERIMENT: ${{ matrix.experiment }}
        run: |
          $proofRoot = Join-Path $env:RUNNER_TEMP ('pr323-optimized-' + $env:EXPERIMENT + '-' + [guid]::NewGuid().ToString('N'))
          [void](New-Item -ItemType Directory -Path $proofRoot)
          [void](New-Item -ItemType Directory -Path (Join-Path $proofRoot 'evidence'))
          "OPTIMIZED_PROOF_ROOT=$proofRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and attest exact frozen revisions
        env:
          EXPERIMENT: ${{ matrix.experiment }}
        run: |
          $ErrorActionPreference = 'Stop'
          $planPath = Join-Path $env:GITHUB_WORKSPACE ('scripts/pr323-optimized-' + $env:EXPERIMENT + '-plan.json')
          $plan = Get-Content -LiteralPath $planPath -Raw | ConvertFrom-Json
          if ($plan.experiment -ne $env:EXPERIMENT) { throw 'Experiment plan mismatch.' }
          $baseline = $plan.revisions.baseline
          $candidate = $plan.revisions.candidate
          if ($candidate -ne 'abc61e8bb7feda23cc5b2ed7b02174130a117cb5') { throw 'Candidate mismatch.' }
          $baselineRepo = Join-Path $env:OPTIMIZED_PROOF_ROOT 'checkout-a'
          $candidateRepo = Join-Path $env:OPTIMIZED_PROOF_ROOT 'checkout-b'
          $baselineCargo = Join-Path $env:OPTIMIZED_PROOF_ROOT 'cargo-out-a'
          $candidateCargo = Join-Path $env:OPTIMIZED_PROOF_ROOT 'cargo-out-b'
          $receiptPath = Join-Path $env:OPTIMIZED_PROOF_ROOT 'evidence/build-provenance.json'
          $receipt = [ordered]@{
            schema = 1
            passed = $false
            experiment = $env:EXPERIMENT
            baselineCommit = $baseline
            candidateCommit = $candidate
            expectedTrees = $plan.trees
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            proofCommit = $env:GITHUB_SHA
            proofRef = $env:GITHUB_REF
            checkoutLeafNames = @('checkout-a', 'checkout-b')
            cargoTargetLeafNames = @('cargo-out-a', 'cargo-out-b')
            commands = @()
          }
          function Run-Checked([string]$Program, [string[]]$Arguments) {
            & $Program @Arguments
            $code = $LASTEXITCODE
            $receipt.commands += [ordered]@{ program = $Program; arguments = $Arguments; exitCode = $code }
            if ($code -ne 0) { throw "$Program failed with exit $code" }
          }
          try {
            if ($baselineRepo.Length -ne $candidateRepo.Length) { throw 'Checkout paths differ in length.' }
            if ($baselineCargo.Length -ne $candidateCargo.Length) { throw 'Cargo paths differ in length.' }
            Run-Checked 'git' @('cat-file', '-e', "$baseline^{commit}")
            Run-Checked 'git' @('cat-file', '-e', "$candidate^{commit}")
            $mergeBase = (& git merge-base $baseline $candidate).Trim()
            if ($LASTEXITCODE -ne 0 -or $mergeBase -ne $baseline) { throw 'Baseline is not the merge-base.' }
            $receipt.mergeBase = $mergeBase
            Run-Checked 'git' @('merge-base', '--is-ancestor', $baseline, $candidate)
            $receipt.baselineIsAncestor = $true
            Run-Checked 'git' @('worktree', 'add', '--detach', $baselineRepo, $baseline)
            Run-Checked 'git' @('worktree', 'add', '--detach', $candidateRepo, $candidate)
            foreach ($build in @(
              @{ repo = $baselineRepo; cargo = $baselineCargo; label = 'baseline'; tree = $plan.trees.baseline },
              @{ repo = $candidateRepo; cargo = $candidateCargo; label = 'candidate'; tree = $plan.trees.candidate }
            )) {
              $actualTree = (& git -C $build.repo rev-parse 'HEAD^{tree}').Trim()
              if ($LASTEXITCODE -ne 0 -or $actualTree -ne $build.tree) { throw 'Source tree differs from frozen plan.' }
              Push-Location $build.repo
              try {
                $env:CARGO_TARGET_DIR = $build.cargo
                Run-Checked 'pnpm' @('install', '--frozen-lockfile')
                Run-Checked 'pnpm' @('build')
              } finally {
                Remove-Item Env:CARGO_TARGET_DIR -ErrorAction SilentlyContinue
                Pop-Location
              }
            }
            $receipt.checkoutPathLengths = @($baselineRepo.Length, $candidateRepo.Length)
            $receipt.cargoTargetPathLengths = @($baselineCargo.Length, $candidateCargo.Length)
            $receipt.node = (& node --version).Trim()
            $receipt.pnpm = (& pnpm --version).Trim()
            $receipt.rustc = (& rustc --version).Trim()
            $receipt.cargo = (& cargo --version).Trim()
            if ($receipt.node -ne 'v22.23.2' -or $receipt.pnpm -ne '11.25.0') { throw 'Toolchain version mismatch.' }
            $receipt.baselineHead = (& git -C $baselineRepo rev-parse HEAD).Trim()
            $receipt.candidateHead = (& git -C $candidateRepo rev-parse HEAD).Trim()
            if ($receipt.baselineHead -ne $baseline -or $receipt.candidateHead -ne $candidate) { throw 'HEAD mismatch.' }
            $receipt.passed = $true
            "OPTIMIZED_PROOF_BASELINE=$baselineRepo" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "OPTIMIZED_PROOF_CANDIDATE=$candidateRepo" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } catch {
            $receipt.error = $_.Exception.Message
            throw
          } finally {
            $receipt | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $receiptPath
          }

      - name: Run exactly one frozen experiment
        env:
          FS_SAFE_NATIVE_MODE: "off"
          EXPERIMENT: ${{ matrix.experiment }}
        run: |
          $plan = 'scripts/pr323-optimized-' + $env:EXPERIMENT + '-plan.json'
          $arguments = @('--mode', 'production', '--plan', $plan,
            '--baseline-dir', $env:OPTIMIZED_PROOF_BASELINE,
            '--candidate-dir', $env:OPTIMIZED_PROOF_CANDIDATE,
            '--output', (Join-Path $env:OPTIMIZED_PROOF_ROOT 'evidence/benchmark'))
          if ($env:EXPERIMENT -eq 'archive-final') {
            & node scripts/pr323-optimized-archive-proof.mjs @arguments
          } else {
            & node scripts/pr323-optimized-producer-proof.mjs --experiment $env:EXPERIMENT @arguments
          }
          exit $LASTEXITCODE

      - name: Upload complete curated evidence including failures
        if: always() && env.OPTIMIZED_PROOF_ROOT != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr323-optimized-${{ matrix.experiment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OPTIMIZED_PROOF_ROOT }}/evidence/
          if-no-files-found: error
