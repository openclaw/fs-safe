name: benchmarks

on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      method_audit:
        description: Run the complete callable-method matrix
        type: boolean
        default: false
      platform:
        description: Method-audit platform
        type: choice
        options: ["all", "linux", "macos", "windows"]
        default: "all"
      compare_ref:
        description: Optional baseline Git ref for the same runner and harness
        type: string
        default: ""
      candidate_ref:
        description: Optional exact 40-hex candidate commit for a reproducible study
        type: string
        default: ""
      iterations:
        description: Method-audit iterations
        type: string
        default: "20"
      samples:
        description: Method-audit samples
        type: string
        default: "5"
      filter:
        description: Optional method-name substring for a focused audit
        type: string
        default: ""
      order:
        description: Baseline/candidate measurement order
        type: choice
        options: ["baseline-candidate", "abba", "baab"]
        default: "baseline-candidate"
      blocks:
        description: Number of complete measurement-order blocks
        type: string
        default: "1"
      native_mode:
        description: Native mode selection
        type: choice
        options: ["both", "off", "require"]
        default: "both"
      node_version:
        description: Node.js version for the method audit
        type: choice
        options: ["22", "24"]
        default: "24"
      control:
        description: Build control for baseline/candidate measurements
        type: choice
        options: ["rebuild", "same-artifact"]
        default: "rebuild"
      timeout_minutes:
        description: Method-audit job timeout
        type: choice
        options: ["45", "90", "120"]
        default: "45"
      expected_harness_sha:
        description: Optional exact reviewed workflow commit expected to supply the harness
        type: string
        default: ""

permissions:
  contents: read

jobs:
  archive-cancellation-native-off-smoke:
    if: github.event_name == 'workflow_dispatch'
    name: Archive cancellation native-off smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure byte-exact checkouts
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Check out proof overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: overlay
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7e167f407151a3669dbaff14fe7b0e69fab53e5a
          fetch-depth: 1
          persist-credentials: false
          path: candidate
      - name: Verify immutable source identities
        shell: bash
        env:
          EXPECTED_CANDIDATE_HEAD: 7e167f407151a3669dbaff14fe7b0e69fab53e5a
          EXPECTED_CANDIDATE_TREE: dfc8c064edf028addf36061d00689476078b812e
          EXPECTED_OVERLAY_HEAD: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_CANDIDATE_HEAD"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$EXPECTED_CANDIDATE_TREE"
          test -z "$(git -C candidate status --porcelain=v1 --untracked-files=no)"
          test "$(git -C overlay rev-parse HEAD)" = "$EXPECTED_OVERLAY_HEAD"
          test -z "$(git -C overlay status --porcelain=v1 --untracked-files=no)"
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml
      - name: Add portable TAR parser target
        run: rustup target add wasm32-unknown-unknown
      - name: Install exact candidate dependencies
        working-directory: candidate
        run: pnpm install --frozen-lockfile
      - name: Build exact candidate
        working-directory: candidate
        run: pnpm build
      - name: Run focused native-off benchmark smoke
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/archive-cancellation-native-off"
          mkdir -p "$proof_root"
          pnpm benchmark:methods --mode off --filter native-codec/ \
            --iterations 1 --samples 1 --warmup 0 \
            --json "$proof_root/report.json" 2>&1 | tee "$proof_root/benchmark.log"
      - name: Verify and bind focused smoke receipt
        shell: bash
        env:
          EXPECTED_CANDIDATE_HEAD: 7e167f407151a3669dbaff14fe7b0e69fab53e5a
          EXPECTED_CANDIDATE_TREE: dfc8c064edf028addf36061d00689476078b812e
          PROOF_WORKFLOW_SHA: ${{ github.workflow_sha }}
          PROOF_EVENT_SHA: ${{ github.sha }}
          PROOF_RUN_ID: ${{ github.run_id }}
          PROOF_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require("node:assert/strict");
          const { execFileSync } = require("node:child_process");
          const { createHash } = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");

          const workspace = process.env.GITHUB_WORKSPACE;
          const candidateRoot = path.join(workspace, "candidate");
          const overlayRoot = path.join(workspace, "overlay");
          const proofRoot = path.join(process.env.RUNNER_TEMP, "archive-cancellation-native-off");
          const reportPath = path.join(proofRoot, "report.json");
          const logPath = path.join(proofRoot, "benchmark.log");
          const sha256 = bytes => createHash("sha256").update(bytes).digest("hex");
          const git = (cwd, ...args) => execFileSync("git", args, { cwd, encoding: "utf8" }).trim();

          const candidateHead = git(candidateRoot, "rev-parse", "HEAD");
          const candidateTree = git(candidateRoot, "rev-parse", "HEAD^{tree}");
          const overlayHead = git(overlayRoot, "rev-parse", "HEAD");
          const overlayTree = git(overlayRoot, "rev-parse", "HEAD^{tree}");
          assert.equal(candidateHead, process.env.EXPECTED_CANDIDATE_HEAD);
          assert.equal(candidateTree, process.env.EXPECTED_CANDIDATE_TREE);
          assert.equal(overlayHead, process.env.PROOF_WORKFLOW_SHA);
          assert.equal(git(candidateRoot, "status", "--porcelain=v1", "--untracked-files=no"), "");
          assert.equal(git(overlayRoot, "status", "--porcelain=v1", "--untracked-files=no"), "");

          const reportBytes = fs.readFileSync(reportPath);
          const report = JSON.parse(reportBytes);
          const expected = [];
          for (const fixture of ["small", "512-members", "16MiB", "concatenated-refills-4MiB"]) {
            for (const codec of ["zstd", "bzip2"]) {
              for (const operation of ["extractArchive", "readArchiveEntry"]) {
                expected.push(`${operation}/native-codec/${codec}/${fixture}`);
              }
            }
          }
          expected.sort();
          assert.equal(report.results.length, 16);
          assert.deepEqual(report.results.map(result => result.name).sort(), expected);
          assert.equal(report.results.filter(result => !result.skipped).length, 0);
          for (const result of report.results) {
            assert.equal(result.skipped, "zstd/bzip2 archives require the native binding");
            assert.equal(Object.hasOwn(result, "medianUs"), false);
          }
          assert.equal(report.metadata.mode, "off");
          assert.equal(report.metadata.native, false);
          assert.equal(report.metadata.nativeHash, null);
          assert.equal(report.metadata.harnessRevision, candidateHead);
          assert.equal(report.coverage.filtered, true);

          const workflowPath = path.join(overlayRoot, ".github", "workflows", "benchmarks.yml");
          const receipt = {
            schemaVersion: 1,
            proof: "archive-cancellation-native-off-smoke",
            overall: true,
            candidate: {
              head: candidateHead,
              tree: candidateTree,
              runnerBlob: git(candidateRoot, "rev-parse", "HEAD:benchmarks/runner.mjs"),
              archiveHarnessBlob: git(candidateRoot, "rev-parse", "HEAD:benchmarks/native-archives.mjs"),
              fixtureBlob: git(candidateRoot, "rev-parse", "HEAD:benchmarks/native-archive-fixtures.mjs"),
              lockfileBlob: git(candidateRoot, "rev-parse", "HEAD:pnpm-lock.yaml"),
            },
            overlay: {
              head: overlayHead,
              tree: overlayTree,
              eventSha: process.env.PROOF_EVENT_SHA,
              workflowSha: process.env.PROOF_WORKFLOW_SHA,
              workflowBlob: git(overlayRoot, "rev-parse", "HEAD:.github/workflows/benchmarks.yml"),
              workflowFileSha256: sha256(fs.readFileSync(workflowPath)),
            },
            run: {
              id: process.env.PROOF_RUN_ID,
              attempt: process.env.PROOF_RUN_ATTEMPT,
              node: process.version,
              platform: `${process.platform}-${process.arch}`,
            },
            benchmark: {
              command: "pnpm benchmark:methods --mode off --filter native-codec/ --iterations 1 --samples 1 --warmup 0 --json <report>",
              reportSha256: sha256(reportBytes),
              logSha256: sha256(fs.readFileSync(logPath)),
              harnessHash: report.metadata.harnessHash,
              distHash: report.metadata.distHash,
              expectedNames: expected,
              resultCount: report.results.length,
              measuredCount: report.results.filter(result => !result.skipped).length,
              skipReason: "zstd/bzip2 archives require the native binding",
              native: report.metadata.native,
              nativeHash: report.metadata.nativeHash,
            },
          };
          fs.writeFileSync(path.join(proofRoot, "receipt.json"), `${JSON.stringify(receipt, null, 2)}\n`);
          console.log(JSON.stringify(receipt, null, 2));
          NODE
      - name: Upload native-off smoke evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-cancellation-native-off-smoke
          path: ${{ runner.temp }}/archive-cancellation-native-off
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  prepare_method_audit:
    if: github.event_name == 'workflow_dispatch' && inputs.method_audit
    name: Prepare method audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      harness_sha: ${{ steps.plan.outputs.harness_sha }}
      candidate_sha: ${{ steps.plan.outputs.candidate_sha }}
      baseline_sha: ${{ steps.plan.outputs.baseline_sha }}
      has_baseline: ${{ steps.plan.outputs.has_baseline }}
      baseline_build_required: ${{ steps.plan.outputs.baseline_build_required }}
      node_version: ${{ steps.plan.outputs.node_version }}
      timeout_minutes: ${{ steps.plan.outputs.timeout_minutes }}
      control_kind: ${{ steps.plan.outputs.control_kind }}
      plan_file_sha256: ${{ steps.plan.outputs.plan_file_sha256 }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure byte-exact checkouts
        run: |
          # checkout v7 has no line-ending input; configure Git before checkout.
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Check out reviewed harness history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: harness
      - name: Validate and resolve method-audit plan
        id: plan
        env:
          METHOD_PLATFORM: ${{ inputs.platform }}
          METHOD_COMPARE_REF: ${{ inputs.compare_ref }}
          METHOD_CANDIDATE_REF: ${{ inputs.candidate_ref }}
          METHOD_ITERATIONS: ${{ inputs.iterations }}
          METHOD_SAMPLES: ${{ inputs.samples }}
          METHOD_FILTER: ${{ inputs.filter }}
          METHOD_ORDER: ${{ inputs.order }}
          METHOD_BLOCKS: ${{ inputs.blocks }}
          METHOD_NATIVE_MODE: ${{ inputs.native_mode }}
          METHOD_NODE_VERSION: ${{ inputs.node_version }}
          METHOD_CONTROL: ${{ inputs.control }}
          METHOD_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
          METHOD_EXPECTED_HARNESS_SHA: ${{ inputs.expected_harness_sha }}
          METHOD_WORKFLOW_SHA: ${{ github.workflow_sha }}
          METHOD_EVENT_SHA: ${{ github.sha }}
          METHOD_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          node "$GITHUB_WORKSPACE/harness/benchmarks/method-audit-evidence.mjs" prepare \
            --harness-root "$GITHUB_WORKSPACE/harness" \
            --output "$RUNNER_TEMP/method-audit-plan.json"
      - name: Upload resolved method-audit plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: method-audit-plan
          path: ${{ runner.temp }}/method-audit-plan.json
          if-no-files-found: error

  method-audit:
    needs: prepare_method_audit
    name: Method audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ fromJSON(needs.prepare_method_audit.outputs.timeout_minutes) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare_method_audit.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      HARNESS_ROOT: ${{ github.workspace }}/harness
      CANDIDATE_ROOT: ${{ github.workspace }}/candidate
      BASELINE_ROOT: ${{ github.workspace }}/baseline
      REPORT_ROOT: ${{ github.workspace }}/artifacts/method-audit
      METHOD_MATRIX_PLATFORM: ${{ matrix.platform }}
      EXPECTED_PLAN_FILE_HASH: ${{ needs.prepare_method_audit.outputs.plan_file_sha256 }}
    steps:
      - name: Configure byte-exact checkouts
        env:
          METHOD_RUNNER_TEMP: ${{ runner.temp }}
        run: |
          if [[ -z "$METHOD_RUNNER_TEMP" ]]; then
            echo "runner temp directory is unavailable" >&2
            exit 2
          fi
          printf 'PLAN_PATH=%s/method-audit-plan/method-audit-plan.json\n' "$METHOD_RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'EVIDENCE_ROOT=%s/method-audit-evidence\n' "$METHOD_RUNNER_TEMP" >> "$GITHUB_ENV"
          # checkout v7 has no line-ending input; configure Git before checkout.
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Download resolved method-audit plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: method-audit-plan
          path: ${{ runner.temp }}/method-audit-plan
      - name: Check out reviewed harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare_method_audit.outputs.harness_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: harness
      - name: Check out resolved candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare_method_audit.outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: candidate
      - name: Check out resolved baseline
        if: needs.prepare_method_audit.outputs.has_baseline == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare_method_audit.outputs.baseline_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: baseline
      - name: Reserve fixed baseline path
        if: needs.prepare_method_audit.outputs.has_baseline != 'true'
        run: mkdir -p "$BASELINE_ROOT"
      - name: Verify reviewed harness before measured builds
        run: |
          node "$HARNESS_ROOT/benchmarks/method-audit-evidence.mjs" verify-harness \
            --plan "$PLAN_PATH" \
            --expected-plan-file-hash "$EXPECTED_PLAN_FILE_HASH" \
            --harness-root "$HARNESS_ROOT"
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.prepare_method_audit.outputs.node_version }}
      - name: Add portable TAR parser target
        run: rustup target add wasm32-unknown-unknown
      - name: Install reviewed harness dependencies
        run: pnpm --dir "$HARNESS_ROOT" install --frozen-lockfile
      - name: Build candidate
        run: |
          pnpm --dir "$CANDIDATE_ROOT" install --frozen-lockfile
          pnpm --dir "$CANDIDATE_ROOT" build
          pnpm --dir "$CANDIDATE_ROOT" native:build
      - name: Build baseline
        if: needs.prepare_method_audit.outputs.baseline_build_required == 'true'
        run: |
          pnpm --dir "$BASELINE_ROOT" install --frozen-lockfile
          pnpm --dir "$BASELINE_ROOT" build
          pnpm --dir "$BASELINE_ROOT" native:build
      - name: Snapshot measured installations
        run: |
          mkdir -p "$EVIDENCE_ROOT"
          node "$HARNESS_ROOT/benchmarks/method-audit-evidence.mjs" snapshot \
            --plan "$PLAN_PATH" \
            --expected-plan-file-hash "$EXPECTED_PLAN_FILE_HASH" \
            --harness-root "$HARNESS_ROOT" \
            --candidate-root "$CANDIDATE_ROOT" \
            --baseline-root "$BASELINE_ROOT" \
            --output "$EVIDENCE_ROOT/before.json"
      - name: Measure and finalize evidence
        env:
          # Git Bash rewrites leading-slash arguments for native programs.
          # Preserve filter bytes even though the validated plan supplies argv directly.
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          node "$HARNESS_ROOT/benchmarks/method-audit-evidence.mjs" measure \
            --plan "$PLAN_PATH" \
            --expected-plan-file-hash "$EXPECTED_PLAN_FILE_HASH" \
            --before "$EVIDENCE_ROOT/before.json" \
            --harness-root "$HARNESS_ROOT" \
            --candidate-root "$CANDIDATE_ROOT" \
            --baseline-root "$BASELINE_ROOT" \
            --output-root "$REPORT_ROOT"
      - name: Upload method measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: method-audit-${{ matrix.platform }}-${{ github.run_id }}
          path: ${{ env.REPORT_ROOT }}/
          if-no-files-found: warn

  benchmark:
    name: Node 22 benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Add portable TAR parser target
        run: rustup target add wasm32-unknown-unknown

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Benchmark
        env:
          FS_SAFE_BENCHMARK_SAMPLES: ${{ github.event_name == 'schedule' && '3' || '1' }}
        run: |
          mkdir -p dist/benchmarks
          pnpm benchmark -- --json dist/benchmarks/results.json --markdown dist/benchmarks/summary.md

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fs-safe-benchmark-${{ github.run_id }}
          path: dist/benchmarks/
