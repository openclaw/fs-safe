name: ReFS copyIn

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refs-copy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refs-copy:
    name: ReFS copyIn (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
            rust: x86_64
          - runner: windows-11-arm
            arch: arm64
            rust: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
      - name: Select native Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-${{ matrix.rust }}-pc-windows-msvc --profile minimal --target wasm32-unknown-unknown
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set stable-${{ matrix.rust }}-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/setup-archive-llvm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm native:build
      - name: Create disposable ReFS VHD (Dev Drive on ARM64)
        shell: pwsh
        run: ./scripts/setup-refs-test-volume.ps1 -DevDrive:(${{ matrix.arch == 'arm64' && '$true' || '$false' }})
      - name: Prove real ReFS clones, physical sharing, and guarded publication
        env:
          FS_SAFE_NATIVE_MODE: require
          EXPECTED_ARCH: ${{ matrix.arch }}
        shell: pwsh
        run: |
          node -e "if (process.arch !== process.env.EXPECTED_ARCH) throw Error('wrong runtime architecture')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test test/root-copy-refs.test.ts test/clone.test.ts test/copy-tree.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Detach and remove disposable VHD
        if: always()
        shell: pwsh
        run: ./scripts/setup-refs-test-volume.ps1 -Cleanup
