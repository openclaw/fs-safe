  package-smoke:
    name: Bundled package smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os == 'windows-latest' && 'fs-safe-windows-16core' || matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
          - windows-latest
        node:
          - 22
          - 24
    steps:
      - name: Check out exact package-proof source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Windows CI runner
        if: matrix.os == 'windows-latest'
        uses: ./.github/actions/verify-windows-ci-runner

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Add portable TAR parser target
        run: rustup target add wasm32-unknown-unknown

      - name: Set up portable archive LLVM
        uses: ./.github/actions/setup-archive-llvm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Build and stage host binding
        run: pnpm native:build

      - name: Verify root-only npm and pnpm consumer installs
        env:
          FS_SAFE_EXPECTED_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm package:smoke

      - name: Verify Windows native PE imports
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows-native-imports.ps1 -Binary packages/win32-x64-msvc/fs-safe-native.node -ConsumerProof release-artifacts/consumer-proof.json -Output release-artifacts/windows-native-pe.json

      - name: Prove native descriptor ownership in Node workers
        env:
          FS_SAFE_NATIVE_MODE: require
        run: pnpm test test/native-worker-fd-ownership.test.ts test/windows-native-fd-bridge.test.ts

      - name: Test Windows owner benchmark control with required native binding
        if: runner.os == 'Windows'
        env:
          FS_SAFE_NATIVE_MODE: require
        run: pnpm test test/benchmark-windows-owner-caught-failure.test.ts

      - name: Upload behavior proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-package-proof-${{ runner.os }}-${{ runner.arch }}-node-${{ matrix.node }}
          path: |
            release-artifacts/manifest.json
            release-artifacts/consumer-proof.json
            release-artifacts/windows-native-pe.json
          if-no-files-found: error
