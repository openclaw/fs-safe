        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.23.4 --locked

      - name: Add Rust targets
        run: rustup target add ${{ matrix.target }} wasm32-unknown-unknown

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build GNU binding and verify glibc floor
        run: node scripts/build-linux-gnu.mjs ${{ matrix.target }}

      - name: Set up portable archive LLVM
        if: matrix.label == 'linux-x64-gnu'
        uses: ./.github/actions/setup-archive-llvm

      - name: Build package and stage GNU x64 binding
        if: matrix.label == 'linux-x64-gnu'
        run: |
          pnpm build
          cp artifacts/fs-safe-native.linux-x64-gnu.node native/
          node scripts/stage-host-native.mjs

      - name: Load and test on glibc 2.28
        if: matrix.label == 'linux-x64-gnu'
        run: bash scripts/test-linux-glibc-floor.sh

