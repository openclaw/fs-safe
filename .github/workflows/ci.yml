            FS_SAFE_PAX_REQUIRE_NATIVE=1 pnpm test test/native-unix-descriptor-admission.test.ts test/native-owned-tree.test.ts test/native-write-containment.test.ts test/native-staging-regression.test.ts test/staged-file.test.ts test/staged-file-failures.test.ts test/staged-symlink.test.ts test/staged-symlink-error-settlement.test.ts test/native-archive-equivalence.test.ts test/native-publish-equivalence.test.ts test/archive-unified.test.ts test/archive-wasm-abi.test.ts test/archive-pax.test.ts test/archive-pax-security.test.ts test/archive-pax-decimal.test.ts test/archive-pax-raw-admission.test.ts test/archive-pax-compressed.test.ts test/archive-tar-strip.test.ts test/archive-tar-framing.test.ts test/archive-tar-framing-compressed.test.ts test/archive-gzip-integrity.test.ts test/archive-gzip-container.test.ts
            FS_SAFE_NATIVE_MODE=require pnpm test test/root-write-mode.test.ts test/root-write-verification.test.ts test/root-write-lifetime.test.ts test/root-write-exact-identity.test.ts test/secret-write-publication.test.ts test/secret-write-preparation.test.ts test/native-write-mode-ownership.test.ts test/native-created-cleanup.test.ts test/file-mode-facades.test.ts test/native-private-creation.test.ts
            FS_SAFE_NATIVE_MODE=require pnpm test test/root-copy-options.test.ts test/root-copy-read-identity.test.ts test/root-copy-symlink-policy.test.ts test/root-copy-windows-publication.test.ts test/root-parent-symlink-policy.test.ts test/root-mutation-authority.test.ts test/root-mutation-dispatch.test.ts test/native-mutation-policy-admission.test.ts test/native-mutation-policy-integration.test.ts test/pinned-mutation-receipt-walk.test.ts test/root-shared-js-mutation-policy.test.ts test/root-windows-legacy-policy-boundaries.test.ts
