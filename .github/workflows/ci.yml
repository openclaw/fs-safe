    name: Native check (linux-x64-musl)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test in Alpine
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work node:24-alpine3.24@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1 sh -euxc '
            apk add --no-cache cargo rust rust-wasm musl-dev build-base python3 tar clang22=22.1.3-r2 llvm22=22.1.3-r0
            export CC_wasm32_unknown_unknown=/usr/lib/llvm22/bin/clang
            export AR_wasm32_unknown_unknown=/usr/lib/llvm22/bin/llvm-ar
            # Alpine installs tar in /bin; the bound producer uses /usr/bin/tar.
            test -x /usr/bin/tar || ln -s /bin/tar /usr/bin/tar
            npm install --global pnpm@12.4.2
            pnpm install --frozen-lockfile
            cargo test --workspace --locked
