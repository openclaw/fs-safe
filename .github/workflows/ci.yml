name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      secure_file_credential_proof:
        description: Run the manual Linux split-credential secure-file proof
        required: false
        default: false
        type: boolean
      windows_package_capacity_proof:
        description: Compare package consumers on standard Windows and the 16-core control using the same build
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-check:
    # The arm64 status name is part of the main branch protection contract.
    name: Native check (${{ matrix.label || (matrix.os == 'xcode-27' && 'macos-15' || matrix.os) }})
    runs-on: ${{ matrix.runner || matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: xcode-27
            label: xcode-27-x64
            architecture: x64
    defaults:
      run:
        shell: ${{ matrix.architecture == 'x64' && 'arch -x86_64 /bin/bash --noprofile --norc -e -o pipefail {0}' || (startsWith(matrix.os, 'windows-') && 'pwsh' || 'bash') }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both Windows versions use standard hosted images. Keep latest's explicit
      # admission separate from Server 2022's existing OS compatibility lane.
      - name: Verify Windows CI runner
        if: matrix.os == 'windows-latest'
        uses: ./.github/actions/verify-windows-ci-runner
        with:
          minimum-logical-processors: "4"

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 24
          architecture: ${{ matrix.architecture }}

      - name: Add portable TAR parser target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # LLVM setup exports temporary paths; key its pinned toolchain source instead.
          key: ${{ matrix.label || matrix.os }}-${{ hashFiles('.github/actions/setup-archive-llvm/**', 'scripts/archive-wasm-build-tools.mjs', 'scripts/build-archive-wasm.mjs') }}
          env-vars: CARGO CC AR CFLAGS CXX CMAKE RUST
          workspaces: |
            . -> target
            . -> target/archive-wasm-allocator-tests

      - name: Set up portable archive LLVM
        uses: ./.github/actions/setup-archive-llvm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Preserve the former 16-core lane's Rust test concurrency on smaller hardware.
      - name: Test native crate
        run: cargo test --workspace --locked${{ matrix.os == 'windows-latest' && ' -- --test-threads=16' || '' }}

      - name: Build package
        run: pnpm build

      - name: Build portable archive allocator test artifact
        run: pnpm archive:wasm:allocator-tests

      - name: Build and stage host binding
        run: pnpm native:build

      - name: Verify Darwin deployment floor and load binding
        if: runner.os == 'macOS'
        run: node scripts/check-darwin-minos.mjs native/fs-safe-native.darwin-${{ matrix.architecture || 'arm64' }}.node ${{ matrix.architecture || 'arm64' }}

      - name: Prove AppContainer private ACL isolation
        if: runner.os == 'Windows'
        id: appcontainer
        run: node scripts/windows-appcontainer-proof.mjs

      - name: Upload AppContainer proof
        if: ${{ always() && runner.os == 'Windows' && steps.appcontainer.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appcontainer-${{ matrix.label || matrix.os }}
          path: artifacts-appcontainer
          if-no-files-found: error

      - name: Prove platform capabilities on the main thread and in Workers
        env:
          FS_SAFE_NATIVE_MODE: require
        run: pnpm test test/platform-capabilities.test.ts

      - name: Prove unsupported no-replace publication fallback
        env:
          FS_SAFE_NATIVE_MODE: require
        run: pnpm test test/native-noreplace-fallback.test.ts test/native-noreplace-owners.test.ts test/linux-noreplace-fallback.test.ts

      - name: Prove Windows retained entry publication
        if: runner.os == 'Windows'
        env:
          FS_SAFE_TEST_PUBLIC_ARTIFACT: "1"
          FS_SAFE_TEST_PUBLICATION_NATIVE: "1"
        run: pnpm test test/entry-publication-windows.test.ts

      - name: Refuse publication on an owned FAT volume
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-publication-volume-proof.ps1

      - name: Force the Linux descriptor-walk fallback
        if: matrix.no-openat2
        shell: bash
        run: echo 'FS_SAFE_TEST_NO_OPENAT2=1' >> "$GITHUB_ENV"

      - name: Prove Linux fallback operations and bounded-cleanup refusal
        if: runner.os == 'Linux'
        env:
          FS_SAFE_NATIVE_MODE: require
        run: pnpm test test/linux-openat2-fallback.test.ts test/root-move-noreplace.test.ts test/root-move-native-integration.test.ts

      - name: Test native overwrite Root moves
        env:
          FS_SAFE_NATIVE_MODE: require
        run: pnpm test test/root-move-replace-native-integration.test.ts

      - name: Test Root mkdir type errors across native modes
        env:
          FS_SAFE_NATIVE_MODE: require
        run: pnpm test test/differential/mkdir-type.test.ts

      - name: Test recursive removal budgets across native modes
        env:
          FS_SAFE_NATIVE_MODE: require
        run: pnpm test test/differential/remove-budget.test.ts

      # This suite requires recursive removal success on Linux, which needs openat2.
      - name: Test native Root removal
        if: ${{ !matrix.no-openat2 }}
        env:
          FS_SAFE_NATIVE_MODE: require
        run: pnpm test test/root-remove-native-integration.test.ts

      - name: Test retained Windows file identity and resource settlement
        if: runner.os == 'Windows'
        env:
          FS_SAFE_NATIVE_MODE: require
        run: pnpm test test/retained-file.test.ts

      - name: Repeat Config sibling isolation twenty times without retries
        if: matrix.os == 'xcode-27'
        env:
          FS_SAFE_TEST_WATCH_EVENTS: "1"
        run: pnpm test test/watch-selection.test.ts -t 'keeps Config entry' --maxWorkers=1 --repeats=19 --retry=0 --reporter=verbose

      - name: Test guarded observation
        env:
          FS_SAFE_TEST_WATCH_EVENTS: "1"
          TEST_ARCHITECTURE: ${{ matrix.architecture }}
        shell: bash
        run: |
          tests=(pnpm test test/watch*.test.ts --maxWorkers=1 --testTimeout=30000 --reporter=verbose)
          if [[ "$TEST_ARCHITECTURE" == x64 ]]; then
            exec arch -x86_64 "${tests[@]}"
          fi
          "${tests[@]}"

      - name: Prove native event delivery on every platform
        run: node scripts/watch-events-proof.mjs

      - name: Measure idle native watch cost
        run: node scripts/watch-idle-proof.mjs

      - name: Prove Windows hub attribution with unrelated workers
        if: runner.os == 'Windows'
        run: node scripts/watch-idle-census-proof.mjs .

      - name: Prove bounded watch shutdown and process exit
        run: node scripts/watch-lifecycle-proof.mjs

      - name: Bound native watch cleanup allocation growth
        if: runner.os == 'macOS'
        env:
          MallocStackLogging: "1"
        run: node --expose-gc scripts/watch-cleanup-leak-proof.mjs

      - name: Upload native watch cleanup allocation reports
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: watch-cleanup-allocation-reports-${{ matrix.label || matrix.os }}
          path: .artifacts/watch-cleanup-leaks
          if-no-files-found: ignore

      - name: Test creation modes under restrictive umask
        if: runner.os == 'Linux'
        shell: bash
        env:
          FS_SAFE_NATIVE_MODE: require
        run: |
          umask 077
          pnpm test --maxWorkers=1 \
            test/directory-mode-proc.test.ts \
            test/root-durable-option.test.ts \
            test/sibling-producer-isolation.test.ts \
            test/sibling-temp-durability.test.ts \
            test/sibling-temp-publication.test.ts \
            test/temp-workspace-creation-admission.test.ts

      - name: Prove retained directory replacement authority
        env:
          FS_SAFE_NATIVE_MODE: require
        run: >-
          pnpm test
          test/native-rename-authority.test.ts
          test/atomic-publication-stress.test.ts
          test/replace-directory-authority.test.ts
          test/replace-directory-identity-rename.test.ts
          test/replace-directory-retained-admission.test.ts
          test/path-input-snapshot.test.ts
          test/windows-drive-relative-adjacent-publication.test.ts

      - name: Prove native directory observation
        env:
          FS_SAFE_REQUIRE_NATIVE_DIRECTORY_OBSERVATION: "1"
        run: pnpm test test/native-directory-observation.test.ts test/root-native-directory-observation.test.ts

      - name: Set up Bun
        if: ${{ !matrix.no-openat2 }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          bun-download-url: ${{ matrix.architecture == 'x64' && 'https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-darwin-x64-baseline.zip' || '' }}

      - name: Measure cold platform entry-point imports
        if: ${{ !matrix.no-openat2 }}
        run: |
          node scripts/platform-import-timings.mjs
          bun scripts/platform-import-timings.mjs

      - name: Prove Windows long paths on Node and Bun
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FS_SAFE_NATIVE_MODE: require
        run: |
          node test/fixtures/windows-long-path-proof.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test/fixtures/windows-native-path-spelling.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/windows-private-repro-proof.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test/fixtures/windows-long-path-proof.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test/fixtures/windows-native-path-spelling.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun scripts/windows-private-repro-proof.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows long-path proof
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-long-path-${{ matrix.label || matrix.os }}
          path: |
            artifacts-windows-long-path
            artifacts-platform-imports
          if-no-files-found: error

      - name: Prove Root copy metadata and literal links on Node and Bun
        if: ${{ !matrix.no-openat2 }}
        env:
          FS_SAFE_NATIVE_MODE: require
        run: |
          node test/fixtures/root-copy-metadata-links.mjs require
          bun test/fixtures/root-copy-metadata-links.mjs require

      - name: Test Bun native compatibility
        if: ${{ !matrix.no-openat2 }}
        run: pnpm test:bun:native

      - name: Compare seeded public Root operations across Node and Bun
        if: ${{ !matrix.no-openat2 }}
        run: node scripts/differential-root.mjs --ci --out artifacts-differential-ci

      - name: Compare seeded public Root operations with the Linux fallback
        if: matrix.no-openat2
        run: node scripts/differential-root.mjs --ci --runtimes node --out artifacts-differential-ci

      - name: Upload differential replay receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: differential-root-${{ matrix.label || matrix.os }}
          path: artifacts-differential-ci
          if-no-files-found: ignore

      - name: Compare portable corpus and publication schedules
        env:
          FS_SAFE_NATIVE_MODE: require
        run: |
          pnpm test test/differential/adversarial.test.ts test/differential/corpus.test.ts
          node scripts/differential-root.mjs --portable --corpus --runtimes node --no-fallback --out artifacts-differential-portable

      - name: Upload portable differential receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: differential-portable-${{ matrix.label || matrix.os }}
          path: artifacts-differential-portable
          if-no-files-found: ignore

      - name: Prove Bun watch polling and joined close
        if: ${{ !matrix.no-openat2 }}
        run: bun scripts/watch-runtime-proof.mjs

      - name: Prove Bun compatibility with JIT disabled
        if: ${{ !matrix.no-openat2 }}
        run: bun --jitless scripts/bun-native-proof.mjs

      - name: Compare create-on-directory errors across implementations
        run: node scripts/root-create-directory-proof.mjs

      - name: Compare Bun create-on-directory errors across implementations
        if: ${{ !matrix.no-openat2 }}
        run: bun scripts/root-create-directory-proof.mjs

      - name: Require Bun native helper
        if: ${{ !matrix.no-openat2 }}
        run: bun scripts/native-mode-smoke.mjs require

      - name: Test directory copying and native cloning
        run: pnpm test test/clone.test.ts test/copy-tree.test.ts

      - name: Test Darwin descriptor ACLs with required Node and Bun bindings
        if: runner.os == 'macOS'
        env:
          FS_SAFE_NATIVE_MODE: require
        run: |
          pnpm test test/darwin-acl-native.test.ts
          bun node_modules/vitest/vitest.mjs run --config scripts/bun-native-vitest.config.ts test/darwin-acl-native.test.ts

      - name: Test native Btrfs snapshots and file clones
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y btrfs-progs strace
          fixture=$(mktemp -d "$RUNNER_TEMP/fs-safe-btrfs.XXXXXX")
          mkdir "$fixture/mount"
          truncate -s 1G "$fixture/volume.img"
          mkfs.btrfs -q "$fixture/volume.img"
          sudo mount -o loop "$fixture/volume.img" "$fixture/mount"
          trap 'sudo umount "$fixture/mount"' EXIT
          sudo chown "$(id -u):$(id -g)" "$fixture/mount"
          TMPDIR="$fixture/mount" cargo test --workspace --locked file_copy::btrfs_tests -- --ignored --test-threads=1
          FS_SAFE_CLONE_TEST_ROOT="$fixture/mount" pnpm test test/clone.test.ts test/btrfs-file-copy.test.ts

      - name: Pin native mutation syscall budgets
        if: runner.os == 'Linux'
        run: |
          for operation in mkdir ensureRoot remove move append openWritable create write tempWorkspace; do
            node scripts/native-call-budget-proof.mjs --operation "$operation"
          done
          for depth in 1 8 32; do
            node scripts/native-call-budget-proof.mjs --operation mkdirNested --depth "$depth"
          done
          for operation in appendCreate openWritableCreate; do
            for depth in 0 1 8; do
              node scripts/native-call-budget-proof.mjs --operation "$operation" --creation-depth "$depth"
            done
          done

      - name: Prove native mkdir retained authority
        run: node scripts/native-mkdir-authority-proof.mjs

      - name: Prove native writable creation authority
        run: node scripts/native-file-creation-authority-proof.mjs

      - name: Pin native temp creation resources
        if: runner.os != 'Linux'
        run: node scripts/native-call-budget-proof.mjs --operation tempWorkspace --resources-only

      - name: Pin native Root verification resources
        if: runner.os != 'Linux'
        run: node scripts/native-call-budget-proof.mjs --operation ensureRoot --resources-only

      - name: Prove Linux copy offload EOF fallback
        if: runner.os == 'Linux'
        run: node scripts/copy-offload-eof-proof.mjs

      # XFS native tree cloning uses the same NO_XDEV/openat2 directory
      # primitive as bounded cleanup, so it requires the ordinary kernel lane.
      - name: Test XFS cloning and unavailable-reflink fallback
        if: runner.os == 'Linux' && !matrix.no-openat2
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y xfsprogs e2fsprogs attr acl
          fixture=$(mktemp -d "$RUNNER_TEMP/fs-safe-xfs.XXXXXX")
          cleanup() {
            for reflink in 1 0; do
              if mountpoint -q "$fixture/mount-$reflink"; then
                sudo umount "$fixture/mount-$reflink"
              fi
            done
          }
          trap cleanup EXIT
          for reflink in 1 0; do
            mount="$fixture/mount-$reflink"
            mkdir "$mount"
            truncate -s 1G "$fixture/volume-$reflink.img"
            mkfs.xfs -q -m "reflink=$reflink" "$fixture/volume-$reflink.img"
            sudo mount -o loop "$fixture/volume-$reflink.img" "$mount"
            sudo chown "$(id -u):$(id -g)" "$mount"
            if [[ "$reflink" == 1 ]]; then
              node scripts/clone-xfs-proof.mjs "$mount"
              TMPDIR="$mount" FS_SAFE_CLONE_TEST_ROOT="$mount" pnpm test test/clone.test.ts test/copy-tree.test.ts
            else
              node scripts/clone-xfs-proof.mjs "$mount" no-reflink
              TMPDIR="$mount" pnpm test test/copy-tree.test.ts
            fi
            sudo umount "$mount"
          done

      # Existing-directory replacement benchmarks require bounded cleanup;
      # the no-openat2 lane checks the corresponding refusal in the tests.
      - name: Smoke method benchmarks with native binding
        if: ${{ !matrix.no-openat2 }}
        run: pnpm benchmark:methods --mode require --iterations 1 --samples 1 --warmup 0

      - name: Prove archive device admission and secret reads with native binding
        run: node scripts/device-path-proof.mjs require

      # Bounded cleanup deliberately refuses without openat2. The fallback
      # fixture above proves that refusal; ordinary lanes prove cleanup success.
      - name: Prove temp workspace quarantine swap at native removal
        if: ${{ !matrix.no-openat2 }}
        run: node scripts/temp-workspace-quarantine-swap-proof.mjs

      - name: Test native mode auto
        run: node scripts/native-mode-smoke.mjs auto

      - name: Test native mode require
        run: node scripts/native-mode-smoke.mjs require

      - name: Test native mode off
        run: node scripts/native-mode-smoke.mjs off

      - name: Prove public retained entry publication
        env:
          FS_SAFE_TEST_PUBLIC_ARTIFACT: "1"
          FS_SAFE_TEST_PUBLICATION_NATIVE: "1"
        run: pnpm test test/entry-publication.test.ts test/entry-publication-symlink.test.ts

      - name: Test bounded hashing with required native binding
        env:
          FS_SAFE_NATIVE_MODE: require
        run: pnpm test test/file-hash-options.test.ts

      - name: Test Windows descriptor ACL admission with required native binding
        env:
          FS_SAFE_NATIVE_MODE: require
        run: pnpm test test/secure-file-windows-descriptor.test.ts test/secure-file-windows-native.test.ts test/owner-dacl-batch.windows.test.ts

      - name: Test Windows owner benchmark control with required native binding
        if: runner.os == 'Windows'
        env:
          FS_SAFE_NATIVE_MODE: require
        run: pnpm test test/benchmark-windows-owner-caught-failure.test.ts

      - name: Test native archive buffer ownership and validation
        env:
          FS_SAFE_NATIVE_MODE: require
        run: pnpm test test/native-zip-buffer.test.ts test/native-tar-buffer.test.ts

      - name: Prove native ZIP buffer lifetime across garbage collection
        run: node --expose-gc scripts/native-zip-buffer-gc-proof.mjs

      - name: Prove native TAR buffer lifetime across garbage collection
        run: node --expose-gc scripts/native-tar-buffer-gc-proof.mjs

      - name: Prove sidecar contention with required native binding
        run: node scripts/sidecar-contention-proof.mjs require

      - name: Test native security and path equivalence
        env:
          FS_SAFE_PAX_REQUIRE_NATIVE: "1"
        run: pnpm test test/linux-openat2-parity.test.ts test/native-integration.test.ts test/native-unix-descriptor-admission.test.ts test/native-write-containment.test.ts test/native-staging-regression.test.ts test/staged-file.test.ts test/staged-file-failures.test.ts test/staged-symlink.test.ts test/staged-symlink-error-settlement.test.ts test/native-archive-equivalence.test.ts test/native-publish-equivalence.test.ts test/private-directory.test.ts test/archive-unified.test.ts test/archive-wasm-abi.test.ts test/archive-pax.test.ts test/archive-pax-compressed.test.ts test/archive-tar-strip.test.ts test/archive-tar-framing.test.ts test/archive-tar-framing-compressed.test.ts test/archive-gzip-integrity.test.ts test/archive-gzip-container.test.ts test/temp-workspace-cleanup-descriptor-access.test.ts

      - name: Test openat2-dependent native cleanup
        if: ${{ !matrix.no-openat2 }}
        run: pnpm test test/native-owned-tree.test.ts test/temp-workspace-cleanup-ownership.test.ts test/temp-workspace-cleanup-admission.test.ts test/temp-workspace-cleanup-capability.test.ts

      - name: Test native Root publication verification
        env:
          FS_SAFE_NATIVE_MODE: require
        run: pnpm test test/root-write-mode.test.ts test/root-write-verification.test.ts test/root-write-lifetime.test.ts test/root-write-exact-identity.test.ts test/secret-write-publication.test.ts test/secret-write-preparation.test.ts test/native-write-mode-ownership.test.ts test/native-created-cleanup.test.ts test/file-mode-facades.test.ts test/native-pinned-write-falsy-close.test.ts test/root-create-file-durability.test.ts test/root-create-atomic.test.ts test/root-create-stream.test.ts test/root-create-authority-snapshot.test.ts test/root-private-creation.test.ts test/create.test.ts test/root-private-creation-failures.test.ts test/native-private-creation.test.ts

      - name: Test guarded Root copying and mutation policies
        env:
          FS_SAFE_NATIVE_MODE: require
        run: pnpm test test/copy-root-file-sync.test.ts test/root-copy-options.test.ts test/root-copy-read-identity.test.ts test/root-copy-symlink-policy.test.ts test/root-copy-windows-publication.test.ts test/root-parent-symlink-policy.test.ts test/root-mutation-authority.test.ts test/root-mutation-dispatch.test.ts test/native-mutation-policy-admission.test.ts test/native-mutation-policy-integration.test.ts test/native-parent-captured-identity.test.ts test/pinned-mutation-receipt-walk.test.ts test/root-shared-js-mutation-policy.test.ts test/root-windows-legacy-policy-boundaries.test.ts

      - name: Test retained sidecar release and exit cleanup
        env:
          FS_SAFE_NATIVE_MODE: require
        run: pnpm test test/sidecar-lock-retained-release.test.ts test/sidecar-lock-retained-exit.test.ts test/sidecar-lock-retention-failure.test.ts test/benchmark-lock-ownership-parsing.test.ts

      - name: Test Root sidecar admission with required native binding
        env:
          FS_SAFE_NATIVE_MODE: require
        run: pnpm test test/root-create-only-preflight.test.ts test/sidecar-lock-mtime-handoff.test.ts test/sidecar-lock-root-admission.test.ts test/sidecar-lock-root-ancestry.test.ts test/sidecar-lock-root-budget.test.ts test/sidecar-lock-root-resolver.test.ts test/sidecar-lock-root-unlink.test.ts test/sidecar-lock-unlink-siblings.test.ts test/file-lock-sync-stale.test.ts test/file-lock-sync-release.test.ts

      - name: Test canonical archive filter paths with required native binding
        env:
          FS_SAFE_PAX_REQUIRE_NATIVE: "1"
        run: pnpm test test/archive-filter-paths.test.ts test/archive-filter-compressed.test.ts test/archive-tar-gnu-meter.test.ts test/archive-tar-ignored-meter.test.ts test/archive-tar-admission.test.ts test/archive-tar-manifest.test.ts

      - name: Test ZIP admission with required native binding
        env:
          FS_SAFE_NATIVE_MODE: require
        run: pnpm test test/archive-zip-admission.test.ts test/archive-zip-metadata.test.ts test/archive-zip-integrity.test.ts
