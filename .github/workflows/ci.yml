name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      secure_file_credential_proof:
        description: Run the manual Linux split-credential secure-file proof
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint workflows
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  secure-file-credential-proof:
    name: Secure-file credential proof (Node ${{ matrix.node }})
    if: github.event_name == 'workflow_dispatch' && inputs.secure_file_credential_proof == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.23.2
          - 24.20.0
    env:
      BASELINE_DIR: ${{ runner.temp }}/fs-safe-secure-file-baseline-${{ matrix.node }}
      PROOF_PARENT: ${{ runner.temp }}/fs-safe-secure-file-proof-${{ matrix.node }}
      RECEIPT_DIR: ${{ runner.temp }}/fs-safe-secure-file-receipt-${{ matrix.node }}
      RECEIPT_PATH: ${{ runner.temp }}/fs-safe-secure-file-receipt-${{ matrix.node }}/secure-file-credential-proof.json
    steps:
      - name: Check out candidate with fixed baseline history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false

      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install proof tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends strace util-linux coreutils libc-bin

      - name: Build candidate as the unprivileged runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          rustup target add wasm32-unknown-unknown
          pnpm install --frozen-lockfile
          pnpm build
          test -f dist/secure-file.js
          test -f dist/config.js
          test -z "$(git status --short --untracked-files=no)"

      - name: Build fixed historical negative control as the unprivileged runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test ! -e "$BASELINE_DIR"
          git cat-file -e 914cd7b41388876b55e1cca76b46b8eb01e46364^{commit}
          git worktree add --detach "$BASELINE_DIR" 914cd7b41388876b55e1cca76b46b8eb01e46364
          pnpm --dir "$BASELINE_DIR" install --frozen-lockfile
          pnpm --dir "$BASELINE_DIR" build
          test -f "$BASELINE_DIR/dist/secure-file.js"
          test -f "$BASELINE_DIR/dist/config.js"
          test -z "$(git -C "$BASELINE_DIR" status --short --untracked-files=no)"
          test "$(git -C "$BASELINE_DIR" show -s --format=%H HEAD)" = 914cd7b41388876b55e1cca76b46b8eb01e46364
          test "$(git -C "$BASELINE_DIR" show -s --format=%T HEAD)" = eb1d05638cd0ec21cea68a8b189ec3e253a8d903

      - name: Prove split real and effective credential behavior
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$PROOF_PARENT"
          install -d -m 0700 "$RECEIPT_DIR"
          candidate_dir=$(realpath "$GITHUB_WORKSPACE")
          baseline_dir=$(realpath "$BASELINE_DIR")
          node_path=$(realpath "$(command -v node)")
          prlimit_path=$(realpath "$(command -v prlimit)")
          setpriv_path=$(realpath "$(command -v setpriv)")
          strace_path=$(realpath "$(command -v strace)")
          timeout_path=$(realpath "$(command -v timeout)")
          getent_path=$(realpath "$(command -v getent)")
          candidate_head=$(git -C "$candidate_dir" show -s --format=%H HEAD)
          candidate_tree=$(git -C "$candidate_dir" show -s --format=%T HEAD)
          baseline_head=$(git -C "$baseline_dir" show -s --format=%H HEAD)
          baseline_tree=$(git -C "$baseline_dir" show -s --format=%T HEAD)
          builder_uid=$(id -u)
          builder_gid=$(id -g)
          sudo -- "$node_path" "$candidate_dir/scripts/secure-file-credential-proof.mjs" \
            --candidate "$candidate_dir" \
            --baseline "$baseline_dir" \
            --worker "$candidate_dir/scripts/secure-file-credential-proof-worker.mjs" \
            --proof-parent "$PROOF_PARENT" \
            --receipt "$RECEIPT_PATH" \
            --node "$node_path" \
            --prlimit "$prlimit_path" \
            --setpriv "$setpriv_path" \
            --strace "$strace_path" \
            --timeout "$timeout_path" \
            --getent "$getent_path" \
            --builder-uid "$builder_uid" \
            --builder-gid "$builder_gid" \
            --candidate-head "$candidate_head" \
            --candidate-tree "$candidate_tree" \
            --baseline-head "$baseline_head" \
            --baseline-tree "$baseline_tree" \
            --expected-node "v${{ matrix.node }}"

      - name: Remove historical worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/fs-safe-secure-file-baseline-${{ matrix.node }}"
          test "$BASELINE_DIR" = "$expected"
          if [[ -e "$BASELINE_DIR" ]]; then
            git worktree remove --force "$BASELINE_DIR"
          fi

      - name: Create failed proof receipt when missing
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e "$RECEIPT_PATH" || -L "$RECEIPT_PATH" ]]; then
            exit 0
          fi
          install -d -m 0700 "$RECEIPT_DIR"
          set -o noclobber
          printf '%s\n' '{"schema":1,"proof":"secure-file-split-credential","overall":false,"failure":{"stage":"workflow-fallback","name":"ProofError","code":"RECEIPT_MISSING"},"workflow":{"fallback":true,"receiptAllowlisted":true}}' > "$RECEIPT_PATH"
          chmod 0644 "$RECEIPT_PATH"
          exit 1

      - name: Upload allowlisted credential receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secure-file-credential-proof-node-${{ matrix.node }}
          path: ${{ env.RECEIPT_PATH }}
          if-no-files-found: error

  check:
    name: Node ${{ matrix.node }} check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
        os:
          - ubuntu-latest
          - macos-15
          - windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Add portable TAR parser target
        run: rustup target add wasm32-unknown-unknown

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Deliberately do not build a host binding here. On Windows this exercises
      # the shipping command fallback; native-check covers the platform binding.
      - name: Check JavaScript fallback
        run: pnpm check

      - name: Smoke method benchmarks with JavaScript fallback
        if: matrix.node == 24
        run: pnpm benchmark:methods --mode off --iterations 1 --samples 1 --warmup 0

      - name: Prove archive device admission and secret reads
        if: matrix.node == 24
        run: node scripts/device-path-proof.mjs off

      - name: Prove slow package-copy fixture lifetime on Windows
        if: matrix.os == 'windows-latest'
        run: pnpm test --config scripts/slow-package-copy.config.ts

      - name: Prove Root sidecar unlinked snapshot handoff and replacement rejection
        if: matrix.node == 24 && (matrix.os == 'ubuntu-latest' || matrix.os == 'macos-15')
        env:
          NODE_ENV: test
        run: node scripts/sidecar-unlinked-snapshot-proof.mjs

      - name: Prove sidecar contention with JavaScript fallback
        if: matrix.node == 24
        run: node scripts/sidecar-contention-proof.mjs off

      - name: Prove regular append identity on Windows
        if: matrix.os == 'windows-latest'
        env:
          NODE_ENV: test
        run: node scripts/regular-append-windows-proof.mjs

  native-check:
    name: Native check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
          - windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Add portable TAR parser target
        run: rustup target add wasm32-unknown-unknown

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test native crate
        run: cargo test --workspace --locked

      - name: Build package
        run: pnpm build

      - name: Build and stage host binding
        run: pnpm native:build

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Test Bun native compatibility
        run: pnpm test:bun:native

      - name: Prove Bun compatibility with JIT disabled
        run: bun --jitless scripts/bun-native-proof.mjs

      - name: Require Bun native helper
        run: bun scripts/native-mode-smoke.mjs require

      - name: Test directory copying and native cloning
        run: pnpm test test/clone.test.ts test/copy-tree.test.ts

      - name: Test native Btrfs snapshots
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y btrfs-progs strace
          fixture=$(mktemp -d "$RUNNER_TEMP/fs-safe-btrfs.XXXXXX")
          mkdir "$fixture/mount"
          truncate -s 1G "$fixture/volume.img"
          mkfs.btrfs -q "$fixture/volume.img"
          sudo mount -o loop "$fixture/volume.img" "$fixture/mount"
          trap 'sudo umount "$fixture/mount"' EXIT
          sudo chown "$(id -u):$(id -g)" "$fixture/mount"
          FS_SAFE_CLONE_TEST_ROOT="$fixture/mount" pnpm test test/clone.test.ts

      - name: Prove Linux copy offload EOF fallback
        if: runner.os == 'Linux'
        run: node scripts/copy-offload-eof-proof.mjs

      - name: Test XFS cloning and unavailable-reflink fallback
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y xfsprogs e2fsprogs attr acl
          fixture=$(mktemp -d "$RUNNER_TEMP/fs-safe-xfs.XXXXXX")
          cleanup() {
            for reflink in 1 0; do
              if mountpoint -q "$fixture/mount-$reflink"; then
                sudo umount "$fixture/mount-$reflink"
              fi
            done
          }
          trap cleanup EXIT
          for reflink in 1 0; do
            mount="$fixture/mount-$reflink"
            mkdir "$mount"
            truncate -s 1G "$fixture/volume-$reflink.img"
            mkfs.xfs -q -m "reflink=$reflink" "$fixture/volume-$reflink.img"
            sudo mount -o loop "$fixture/volume-$reflink.img" "$mount"
            sudo chown "$(id -u):$(id -g)" "$mount"
            if [[ "$reflink" == 1 ]]; then
              node scripts/clone-xfs-proof.mjs "$mount"
              TMPDIR="$mount" FS_SAFE_CLONE_TEST_ROOT="$mount" pnpm test test/clone.test.ts test/copy-tree.test.ts
            else
              node scripts/clone-xfs-proof.mjs "$mount" no-reflink
              TMPDIR="$mount" pnpm test test/copy-tree.test.ts
            fi
            sudo umount "$mount"
          done

      - name: Smoke method benchmarks with native binding
        run: pnpm benchmark:methods --mode require --iterations 1 --samples 1 --warmup 0

      - name: Prove archive device admission and secret reads with native binding
        run: node scripts/device-path-proof.mjs require

      - name: Prove temp workspace quarantine swap at native removal
        run: node scripts/temp-workspace-quarantine-swap-proof.mjs

      - name: Test native mode auto
        run: node scripts/native-mode-smoke.mjs auto

      - name: Test native mode require
        run: node scripts/native-mode-smoke.mjs require

      - name: Test native mode off
        run: node scripts/native-mode-smoke.mjs off

      - name: Test bounded hashing with required native binding
        env:
          FS_SAFE_NATIVE_MODE: require
        run: pnpm test test/file-hash-options.test.ts

      - name: Test Windows descriptor ACL admission with required native binding
        env:
          FS_SAFE_NATIVE_MODE: require
        run: pnpm test test/secure-file-windows-descriptor.test.ts test/secure-file-windows-native.test.ts

      - name: Test native archive buffer ownership and validation
        env:
          FS_SAFE_NATIVE_MODE: require
        run: pnpm test test/native-zip-buffer.test.ts test/native-tar-buffer.test.ts

      - name: Prove native ZIP buffer lifetime across garbage collection
        run: node --expose-gc scripts/native-zip-buffer-gc-proof.mjs

      - name: Prove native TAR buffer lifetime across garbage collection
        run: node --expose-gc scripts/native-tar-buffer-gc-proof.mjs

      - name: Prove sidecar contention with required native binding
        run: node scripts/sidecar-contention-proof.mjs require

      - name: Test native security and path equivalence
        env:
          FS_SAFE_PAX_REQUIRE_NATIVE: "1"
        run: pnpm test test/native-integration.test.ts test/native-owned-tree.test.ts test/native-write-containment.test.ts test/native-staging-regression.test.ts test/staged-file.test.ts test/staged-file-failures.test.ts test/native-archive-equivalence.test.ts test/native-publish-equivalence.test.ts test/private-directory.test.ts test/archive-unified.test.ts test/archive-wasm-abi.test.ts test/archive-pax.test.ts test/archive-pax-security.test.ts test/archive-pax-compressed.test.ts test/archive-tar-strip.test.ts test/archive-tar-framing.test.ts test/archive-tar-framing-compressed.test.ts test/archive-gzip-integrity.test.ts test/archive-gzip-container.test.ts test/temp-workspace-cleanup-ownership.test.ts test/temp-workspace-cleanup-admission.test.ts test/temp-workspace-cleanup-capability.test.ts

      - name: Test native Root publication verification
        env:
          FS_SAFE_NATIVE_MODE: require
        run: pnpm test test/root-write-mode.test.ts test/root-write-verification.test.ts test/root-write-lifetime.test.ts test/root-write-exact-identity.test.ts test/secret-write-publication.test.ts test/native-write-mode-ownership.test.ts test/native-created-cleanup.test.ts test/file-mode-facades.test.ts

      - name: Test guarded Root copying and mutation policies
        env:
          FS_SAFE_NATIVE_MODE: require
        run: pnpm test test/root-copy-options.test.ts test/root-copy-read-identity.test.ts test/root-copy-symlink-policy.test.ts test/root-copy-windows-publication.test.ts test/root-parent-symlink-policy.test.ts test/root-mutation-authority.test.ts test/root-mutation-dispatch.test.ts

      - name: Test Root sidecar admission with required native binding
        env:
          FS_SAFE_NATIVE_MODE: require
        run: pnpm test test/root-create-only-preflight.test.ts test/sidecar-lock-root-admission.test.ts test/sidecar-lock-root-ancestry.test.ts test/sidecar-lock-root-budget.test.ts test/sidecar-lock-root-resolver.test.ts test/sidecar-lock-root-unlink.test.ts test/sidecar-lock-unlink-siblings.test.ts test/file-lock-sync-stale.test.ts test/file-lock-sync-release.test.ts

      - name: Test canonical archive filter paths with required native binding
        env:
          FS_SAFE_PAX_REQUIRE_NATIVE: "1"
        run: pnpm test test/archive-filter-paths.test.ts test/archive-filter-compressed.test.ts test/archive-tar-gnu.test.ts test/archive-tar-gnu-meter.test.ts test/archive-tar-ignored.test.ts test/archive-tar-ignored-meter.test.ts test/archive-tar-admission.test.ts test/archive-tar-manifest.test.ts

      - name: Test ZIP admission with required native binding
        env:
          FS_SAFE_NATIVE_MODE: require
        run: pnpm test test/archive-zip-admission.test.ts test/archive-zip-metadata.test.ts test/archive-zip-integrity.test.ts

  native-musl:
    name: Native check (linux-x64-musl)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test in Alpine
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work node:24-alpine sh -euxc '
            apk add --no-cache cargo rust rust-wasm musl-dev build-base python3 tar
            # Alpine installs tar in /bin; the bound producer uses /usr/bin/tar.
            test -x /usr/bin/tar || ln -s /bin/tar /usr/bin/tar
            npm install --global pnpm@11.25.0
            pnpm install --frozen-lockfile
            cargo test --workspace --locked
            pnpm build
            pnpm native:build
            node scripts/temp-workspace-quarantine-swap-proof.mjs
            pnpm package:smoke
            node scripts/native-mode-smoke.mjs auto
            node scripts/native-mode-smoke.mjs require
            node scripts/native-mode-smoke.mjs off
            FS_SAFE_NATIVE_MODE=require pnpm test test/file-hash-options.test.ts
            node scripts/sidecar-contention-proof.mjs require
            FS_SAFE_NATIVE_MODE=require pnpm test test/root-create-only-preflight.test.ts test/sidecar-lock-root-admission.test.ts test/sidecar-lock-root-ancestry.test.ts test/sidecar-lock-root-budget.test.ts test/sidecar-lock-root-resolver.test.ts test/sidecar-lock-root-unlink.test.ts test/sidecar-lock-unlink-siblings.test.ts test/file-lock-sync-stale.test.ts test/file-lock-sync-release.test.ts
            FS_SAFE_PAX_REQUIRE_NATIVE=1 pnpm test test/native-owned-tree.test.ts test/native-write-containment.test.ts test/native-staging-regression.test.ts test/staged-file.test.ts test/staged-file-failures.test.ts test/native-archive-equivalence.test.ts test/native-publish-equivalence.test.ts test/archive-unified.test.ts test/archive-wasm-abi.test.ts test/archive-pax.test.ts test/archive-pax-security.test.ts test/archive-pax-compressed.test.ts test/archive-tar-strip.test.ts test/archive-tar-framing.test.ts test/archive-tar-framing-compressed.test.ts test/archive-gzip-integrity.test.ts test/archive-gzip-container.test.ts
            FS_SAFE_NATIVE_MODE=require pnpm test test/root-write-mode.test.ts test/root-write-verification.test.ts test/root-write-lifetime.test.ts test/root-write-exact-identity.test.ts test/secret-write-publication.test.ts test/native-write-mode-ownership.test.ts test/native-created-cleanup.test.ts test/file-mode-facades.test.ts
            FS_SAFE_NATIVE_MODE=require pnpm test test/root-copy-options.test.ts test/root-copy-read-identity.test.ts test/root-copy-symlink-policy.test.ts test/root-copy-windows-publication.test.ts test/root-parent-symlink-policy.test.ts test/root-mutation-authority.test.ts test/root-mutation-dispatch.test.ts
            FS_SAFE_NATIVE_MODE=require pnpm test test/archive-zip-admission.test.ts test/archive-zip-metadata.test.ts test/archive-zip-integrity.test.ts
            FS_SAFE_PAX_REQUIRE_NATIVE=1 pnpm test test/archive-filter-paths.test.ts test/archive-filter-compressed.test.ts test/archive-tar-gnu.test.ts test/archive-tar-gnu-meter.test.ts test/archive-tar-ignored.test.ts test/archive-tar-ignored-meter.test.ts test/archive-tar-admission.test.ts test/archive-tar-manifest.test.ts
          '

      - name: Upload musl consumer proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-package-proof-linux-x64-musl
          path: |
            release-artifacts/manifest.json
            release-artifacts/consumer-proof.json
          if-no-files-found: error

  cargo-quality:
    name: Cargo clippy and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-quality-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Clippy
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit
        run: cargo audit --deny warnings

  package-smoke:
    name: Bundled package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
          - windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Add portable TAR parser target
        run: rustup target add wasm32-unknown-unknown

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Build and stage host binding
        run: pnpm native:build

      - name: Verify root-only npm and pnpm consumer installs
        run: pnpm package:smoke

      - name: Upload behavior proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-package-proof-${{ runner.os }}-${{ runner.arch }}
          path: |
            release-artifacts/manifest.json
            release-artifacts/consumer-proof.json
          if-no-files-found: error
