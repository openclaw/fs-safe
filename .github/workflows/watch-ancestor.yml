name: watch ancestor scopes

on:
  pull_request:
    paths:
      - 'src/watch*'
      - 'native/src/watch*'
      - 'scripts/watch-ancestor*'
      - 'test/watch*'
      - '.github/workflows/watch-ancestor.yml'
  workflow_dispatch:

permissions:
  contents: read

# Keep non-PR runs independent, including pending main pushes and manual studies.
concurrency:
  group: watch-ancestor-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ancestor:
    name: Ancestor scopes (${{ matrix.label || matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: xcode-27
          - os: xcode-27
            label: xcode-27-x64
            architecture: x64
          - os: windows-latest
    defaults:
      run:
        shell: ${{ matrix.architecture == 'x64' && 'arch -x86_64 /bin/bash --noprofile --norc -e -o pipefail {0}' || 'bash' }}
    env:
      FS_SAFE_NATIVE_MODE: require
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main before entry transport splitting; a fixed negative control also works after landing.
          ref: ff0bfa4f74f09a1bf08bd1ed9c1bce83d2fde45d
          path: baseline
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 24
          architecture: ${{ matrix.architecture }}
      - uses: ./.github/actions/setup-archive-llvm
      - name: Prepare toolchain
        run: rustup target add wasm32-unknown-unknown
      - name: Build baseline
        working-directory: baseline
        run: |
          git rev-parse HEAD
          pnpm install --frozen-lockfile
          pnpm build
          pnpm native:build
      - name: Build candidate
        run: |
          git rev-parse HEAD
          pnpm install --frozen-lockfile
          pnpm build
          pnpm native:build
          mkdir -p ancestor-results
      - name: Baseline entry storm (macOS) or measurement (Windows)
        env:
          FS_SAFE_PROOF_DIST: baseline/dist
          FS_SAFE_PROOF_EXPECT: ${{ runner.os == 'macOS' && 'storm' || 'measure' }}
        run: node scripts/watch-ancestor-proof.mjs | tee ancestor-results/baseline-entry.json
      - name: Candidate entry events
        if: ${{ !cancelled() }}
        env:
          FS_SAFE_PROOF_EXPECT: ${{ runner.os == 'macOS' && 'zero' || 'measure' }}
        run: node scripts/watch-ancestor-proof.mjs | tee ancestor-results/candidate-entry.json
      - name: Poll control
        if: ${{ !cancelled() }}
        env:
          FS_SAFE_PROOF_MODE: poll
        run: node scripts/watch-ancestor-proof.mjs | tee ancestor-results/poll-entry.json
      - name: Measure remaining depth-one tree traffic
        if: ${{ !cancelled() }}
        env:
          FS_SAFE_PROOF_KIND: tree
          FS_SAFE_PROOF_EXPECT: measure
        run: node scripts/watch-ancestor-proof.mjs | tee ancestor-results/candidate-tree.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ancestor-scopes-${{ matrix.label || matrix.os }}
          path: ancestor-results/*.json
          if-no-files-found: error
