name: Windows creation diagnostic
on:
  push:
    branches: [koffi/f3-win32-arm64]
    paths:
      - .github/workflows/windows-creation-diagnostic.yml
      - scripts/creation-diagnostic-*.mjs
permissions:
  contents: read
jobs:
  measure:
    name: Creation diagnostic (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm-host-arm-node
            os: windows-11-arm
            arch: arm64
            rust: aarch64
          - label: arm-host-x64-node
            os: windows-11-arm
            arch: x64
            rust: x86_64
          - label: x64-host-x64-node
            os: windows-latest
            arch: x64
            rust: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
      - name: Select Rust
        run: |
          rustup toolchain install stable-${{ matrix.rust }}-pc-windows-msvc --force-non-host --profile minimal --target wasm32-unknown-unknown
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set stable-${{ matrix.rust }}-pc-windows-msvc
      - uses: ./.github/actions/setup-archive-llvm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm native:build
      - name: Prepare temporary instrumentation
        run: node scripts/creation-diagnostic-setup.mjs
      - name: Measure three complete omitted-optionals probes without an aggregate deadline
        run: pnpm package:smoke
      - name: Record PowerShell architecture
        if: always()
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -Command '$env:PROCESSOR_ARCHITECTURE'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: creation-diagnostic-${{ matrix.label }}
          path: |
            release-artifacts/creation-summary.json
            release-artifacts/creation-sample-*.jsonl
          if-no-files-found: warn
