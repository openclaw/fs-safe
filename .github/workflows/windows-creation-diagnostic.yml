name: Windows creation diagnostic
# Same-run base/candidate comparison with the final helper entry point.
on:
  push:
    branches: [perf/windows-security-helper-transport]
    paths:
      - .github/workflows/windows-creation-diagnostic.yml
      - scripts/creation-diagnostic-*.mjs
permissions:
  contents: read
jobs:
  measure:
    name: Creation diagnostic (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm-host-arm-node
            os: windows-11-arm
            arch: arm64
            rust: aarch64
          - label: arm-host-x64-node
            os: windows-11-arm
            arch: x64
            rust: x86_64
          - label: x64-host-x64-node
            os: windows-latest
            arch: x64
            rust: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
      - name: Select Rust
        run: |
          rustup toolchain install stable-${{ matrix.rust }}-pc-windows-msvc --force-non-host --profile minimal --target wasm32-unknown-unknown
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set stable-${{ matrix.rust }}-pc-windows-msvc
      - uses: ./.github/actions/setup-archive-llvm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm native:build
      - name: Candidate private creation, handoff, secure file and Worker suites
        run: pnpm test private secure-file windows-security platform-capabilities
      - name: Prepare and measure immutable base
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'fs-safe-helper-base'
          git worktree add --detach $base e38fbc537ecd1446cebb75845e62177ea371edd3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item scripts/creation-diagnostic-*.mjs (Join-Path $base 'scripts')
          Push-Location $base
          rustup override set stable-${{ matrix.rust }}-pc-windows-msvc
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm native:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/creation-diagnostic-setup.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm package:smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          New-Item -ItemType Directory -Force diagnostic-base
          Copy-Item (Join-Path $base 'release-artifacts/creation-*') diagnostic-base
      - name: Measure candidate with identical observer and no aggregate deadline
        run: |
          node scripts/creation-diagnostic-setup.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm package:smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: creation-diagnostic-${{ matrix.label }}
          path: |
            diagnostic-base/creation-*
            release-artifacts/creation-*
          if-no-files-found: warn
