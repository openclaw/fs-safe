name: Set up Node and pnpm
description: Install pnpm and Node with the pnpm dependency cache
inputs:
  node-version:
    description: Node.js version to install
    required: true
  architecture:
    description: Node.js architecture (defaults to the runner architecture)
    default: ""
  pnpm-version:
    description: pnpm version to install
    default: "12.10.1"
runs:
  using: composite
  steps:
    # pnpm 12 installs a native executable through npm. Select the requested
    # Node architecture first so its installer does not inherit the host arch.
    - name: Select Node architecture before installing pnpm
      if: inputs.architecture != ''
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        architecture: ${{ inputs.architecture }}
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        architecture: ${{ inputs.architecture }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
