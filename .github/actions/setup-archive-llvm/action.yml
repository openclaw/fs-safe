name: Set up archive LLVM
description: Prepare the pinned SDK for the Windows helper and LLVM tools for portable archives
runs:
  using: composite
  steps:
    - name: Check pinned SDK
      id: sdk
      shell: bash
      env:
        ARCHIVE_LLVM_ACTION_PATH: ${{ github.action_path }}
      run: node "$ARCHIVE_LLVM_ACTION_PATH/../setup-windows-helper/check.mjs"
    - name: Install pinned SDK when absent
      if: steps.sdk.outputs.available == 'true' && steps.sdk.outputs.installed != 'true'
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      with:
        global-json-file: ${{ steps.sdk.outputs.sdk_file }}
    - name: Install portable archive compiler and archiver
      shell: bash
      env:
        ARCHIVE_LLVM_ACTION_PATH: ${{ github.action_path }}
      run: node "$ARCHIVE_LLVM_ACTION_PATH/install.mjs"
