name: Set up Windows helper compiler
description: Use the installed pinned SDK or install it for the portable helper build
runs:
  using: composite
  steps:
    - name: Check pinned SDK
      id: sdk
      shell: bash
      env:
        SDK_ACTION_PATH: ${{ github.action_path }}
      run: node "$SDK_ACTION_PATH/check.mjs"
    - name: Install pinned SDK when absent
      if: steps.sdk.outputs.available == 'true' && steps.sdk.outputs.installed != 'true'
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      with:
        global-json-file: ${{ steps.sdk.outputs.sdk_file }}
